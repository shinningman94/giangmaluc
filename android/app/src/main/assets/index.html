/* v4.7: 99 kiếp nạn. Mỗi nạn: t tên, n người giao việc, d tình hình, s[3] diễn biến từng chặng, b/bs trùm (nếu có) */
const NQ=[{"t":"Ma trơi dẫn lối","n":"Ông lão gác đình","d":"Minh Dạ vừa rời am thầy, đêm đầu tiên ghé làng Hương Khói. Dân kể những đốm lửa xanh lập lòe ngoài bờ ruộng dụ người lạc khỏi đường cái.","s":["Thằng Tí chăn trâu kể lửa xanh hay hiện quanh nấm mả hoang trên gò Mối, nơi chôn ông bán dầu chết đuối năm lụt.","Thắp nén hương và cắm bùa trấn yểm trên gò Mối. Mấy đốm ma trơi tụ lại thành bầy, lao vào thầy pháp còn non tay.","Hồn ông bán dầu hiện ra, chỉ muốn ai tìm giùm đôi quang gánh rơi dưới mương. Đánh tan oán khí, ông cúi đầu rồi tan theo khói hương."]},{"t":"Gà gáy giờ Tý","n":"Chị Tư bán xôi","d":"Mấy đêm liền, gà cả xóm Đông gáy đúng giờ Tý, sáng ra lại có một con chết khô, lông trắng bệch. Người già bảo có kẻ đang hút dương khí.","s":["Dò quanh chuồng gà, thầy thấy dấu chân trẻ con nhỏ xíu, ướt bùn, dẫn về phía ao bèo sau nhà ông Cửu.","Rắc tro bếp quanh ao để giữ dấu vết. Lũ oan hồn lẩn dưới bèo trồi lên, mặt mũi trắng bợt, cản không cho lại gần.","Một đứa bé ma ôm con gà chết chui ra: nó là con nuôi nhà ông Cửu, chết đuối mà không ai cúng. Hàng phục nó rồi lập bàn thờ nhỏ cho nó."]},{"t":"Nhang đen lò Cả","n":"Bác thợ nhang Lộc","d":"Làng Hương Khói sống bằng nghề se nhang. Từ lúc lò Cả nhập mẻ bột trầm lạ, ai thắp nhang làng cũng mê man, khói lại bay xuôi xuống đất.","s":["Thầy bẻ một nén nhang ra, thấy lẫn tro xương và tóc người. Bột trầm do một lái buôn che khăn kín mặt mang tới từ bến Đá.","Đến kho lò Cả đốt sạch mẻ bột trầm ô uế. Khói đen cuộn lại thành bầy quỷ sai, gào thét lao ra cản lửa.","Hồn tên lái buôn hiện nguyên hình, hắn chết từ lâu và bị kẻ khác sai khiến. Bị đánh bại, hắn chỉ kịp lắp bắp hai chữ: \"Bà Đồng\"."]},{"t":"Chuông đình hóa câm","n":"Thủ từ Khang","d":"Chiếc chuông đồng đình Hương Khói gõ mãi không ra tiếng, từ hôm ấy đêm nào cũng có tiếng chân lết quanh sân đình. Dân sợ ma quỷ đã vào tới chốn thờ.","s":["Trong lòng chuông dán một lá bùa vẽ ngược bằng máu gà, nét bút giống chữ bà đồng Nguyệt ở xóm Bãi, người vừa bị làng đuổi đi.","Gỡ bùa và rửa chuông bằng nước giếng chùa lúc gà gáy. Bầy xác sống bò ra từ bãi tha ma sau đình, chặn lối ra giếng.","Kẻ giữ bùa là hồn cô hầu đồng chết oan trong một buổi lên đồng năm xưa, bị bà đồng Nguyệt sai khiến. Phải đánh tan xiềng oán khí trói cô."]},{"t":"Điện đồng xóm Bãi","n":"Lý trưởng Thục","d":"Bà đồng Nguyệt bị làng đuổi vì lừa tiền cúng, chết rét trong điện cũ xóm Bãi. Oán khí bà nuôi bằng nhang đen nay đủ để kéo cả làng xuống âm.","s":["Trong điện có cuốn sổ ghi tên từng nhà đã đuổi bà, mỗi tên cắm một nén nhang đen. Nén cuối cùng ghi tên Lý trưởng.","Nhổ sạch nhang đen trên bàn thờ trước khi nén cuối cháy hết. Lũ oan hồn bị trói trong sổ lao ra, tay bám cổ thầy kéo lại.","Bà Đồng Nhang Đen hiện ra trong áo trắng ướt sương, tóc xõa tới gót, cất giọng hát văn rợn người. Trận trùm đầu tiên của Minh Dạ bắt đầu."],"b":"Bà Đồng Nhang Đen","bs":"ao_trang"},{"t":"Giếng cổ khóc đêm","n":"Bà cụ bán nước","d":"Đêm nào giếng cổ đầu làng cũng vọng lên tiếng khóc của một cô gái. Có người cúi xuống nhìn thì thấy mặt mình dưới nước đang cười.","s":["Bà cụ nhớ năm đói, cô Thắm con nhà hàng xén bị đồn trộm gạo rồi mất tích. Dưới đáy giếng vẫn lấp lánh chiếc trâm bạc của cô.","Thả dây xuống vớt chiếc trâm trước canh ba. Nước giếng sôi lên, những bàn tay oan hồn trắng bệch níu dây kéo thầy xuống.","Hồn cô Thắm hiện ra, tóc quấn rong rêu, khóc rằng kẻ trộm gạo chính là người tố cô. Hàng phục oán khí để cô chịu nói tên kẻ ấy."]},{"t":"Kho thóc mọc tóc","n":"Anh Ba làm thuê","d":"Từ hôm cô Thắm được siêu thoát, kho thóc nhà hương Phú đêm nào cũng mọc tóc đen giữa các bao. Hương Phú ốm liệt giường, miệng lẩm bẩm xin tha.","s":["Anh Ba khai năm đói, hương Phú giấu gạo cứu tế trong kho rồi đổ tội cho cô Thắm. Tóc mọc ra từ đúng góc kho chứa bao gạo ấy.","Đem gạo trong kho chia cho dân nghèo để giải oán. Đám quỷ đói lũ lượt chui ra từ các bao, giành giật và chắn cửa kho.","Cái đói năm xưa ngưng thành một bóng ma gầy trơ xương, là hồn những người chết đói. Đánh tan nó, hương Phú quỳ trước sân đình thú tội."]},{"t":"Tiếng rìu giữa rừng","n":"Ông tiều Sáu","d":"Rời làng, Minh Dạ vào Rừng Âm U. Tiều phu đồn đêm nào cũng nghe tiếng rìu đốn gỗ trong rừng thông già, mà sáng ra chẳng thấy cây nào đổ.","s":["Lần theo tiếng rìu, thầy gặp hàng thông bị khắc dấu chữ thập, mỗi dấu rỉ nhựa đỏ như máu. Ông Sáu bảo đó là dấu của phường gỗ lậu năm xưa.","Bôi bùa lên từng gốc thông bị khắc để chặn oán khí lan ra. Bầy xác sống mặc áo tơi, đội nón lá, lừ đừ vác rìu chặn đường.","Hồn tên cai phường gỗ lậu hiện ra, bị chính đồng bọn chôn sống dưới gốc thông vì chia chác. Hắn vẫn đốn mãi để tìm đường ra."]},{"t":"Đò đêm không lái","n":"Cô hàng nước bến","d":"Nơi suối Thông chảy qua rừng có con đò cũ tự trôi qua sông lúc nửa đêm. Ai bước lên đều mất tích, chỉ còn đôi dép để lại trên bến.","s":["Ông lái đò Tám chết đuối từ mùa lũ trước, xác chưa tìm thấy. Mũi đò còn buộc một sợi dây đỏ dẫn ngược về phía đầu nguồn.","Chèo theo sợi dây đỏ tới vũng xoáy đầu nguồn tìm người mất tích. Lũ oan hồn chết đuối trồi lên quanh mạn đò, níu chặt mái chèo.","Hồn ông lái đò hiện ra trên mũi thuyền, mặt trương phình. Ông bị bọn cướp ma trên đồi sai đi bắt người, phải đánh tan xiềng oán khí mới cứu được."]},{"t":"Trại cướp đồi Thông","n":"Anh Tư thoát nạn","d":"Những người mất tích trên đò đêm bị lôi về trại cướp bỏ hoang trên đồi Thông. Lửa trại cháy xanh suốt đêm, tiếng cười say vang khắp rừng.","s":["Anh Tư trốn về kể bọn cướp bắt người khiêng hòm bạc lên đồi, dù chúng đã chết từ trăm năm trước khi quan quân vây trại.","Lẻn vào trại cởi trói cho người bị bắt. Đám lâu la ma lăm lăm mã tấu gỉ sét ùa ra, rú lên như sói.","Tướng Cướp Râu Đỏ ngồi dậy trên ghế da hổ, tay vẫn ôm khư khư hòm bạc. Hắn thề không kẻ nào được đụng vào kho của hắn."],"b":"Tướng Cướp Râu Đỏ","bs":"geroh"},{"t":"Bẫy kẹp vô chủ","n":"Thợ săn Khẩn","d":"Khắp lối mòn bỗng mọc đầy bẫy kẹp gỉ sét, sập vào chân người đi rừng. Thợ săn trong vùng đều thề không phải bẫy của mình.","s":["Bẫy nào cũng buộc túm lông chim trĩ, kiểu bẫy của lão Khoát, thợ săn đã mất. Con trai lão năm xưa chết vì sập đúng bẫy cha đặt.","Gỡ hết bẫy dọc khe Đá Trắng và chôn xuống đất chùa. Lũ oan hồn người và thú bị bẫy năm nào gầm gừ xông tới.","Hồn thằng bé con lão Khoát hiện ra, chân còn kẹp bẫy, giận cha không về tìm mình. Hàng phục nó rồi đưa nó về nằm cạnh mộ cha."]},{"t":"Đường mòn đi vòng","n":"Cậu bé lạc rừng","d":"Ai vào Rừng Âm U chiều nay đều đi mãi một đoạn đường, rồi lại về đúng gốc thông cụt ngọn. Có người đi vòng ba ngày rồi ngã gục.","s":["Ở gốc thông cụt có đống đá xếp chồng, kiểu đá đánh dấu đường của người đi rừng. Ai đó đã xếp ngược hướng mũi đá.","Dời lại từng đống đá dọc đường để phá trận mê. Ma trơi lượn quanh, dắt theo bầy oan hồn mắt trắng dã lao ra.","Kẻ đứng sau là hồn một người phu trạm chết lạc khi mang thư hỏa tốc. Hắn muốn kẻ khác cùng lạc như mình, phải đánh tan để hắn yên nghỉ."]},{"t":"Nhà sàn giữa sương","n":"Bà cụ hái nấm","d":"Sương chiều xuống thì hiện ra một căn nhà sàn sáng đèn, có cô gái mời khách nghỉ chân. Mấy người đi rừng vào đó đều không trở ra.","s":["Bà cụ kể nhà sàn ấy cháy rụi ba mươi năm trước trong đêm cưới. Thầy nhặt được nửa chiếc lược sừng cháy xém dưới lớp tro.","Đốt bùa xua sương lúc mặt trời lặn để nhà sàn hiện nguyên hình. Lũ khách ma trong tiệc cưới năm xưa đứng dậy, cháy đỏ, chặn lối.","Cô dâu ma hiện ra, vẫn mặc áo cưới cháy dở, chờ chú rể đã bỏ chạy đêm ấy. Hàng phục rồi trao lại nửa chiếc lược để cô buông bỏ."]},{"t":"Lò đèn lồng bỏ ngỏ","n":"Vợ thợ đèn Huấn","d":"Ông Huấn làm đèn lồng giỏi nhất xóm ven rừng bỗng biến mất. Lò đèn bỏ ngỏ, vậy mà nan tre vẫn tự uốn thành khung đèn suốt đêm.","s":["Trên bàn có tờ giấy đặt một trăm chiếc đèn, trả bằng bạc âm phủ, hẹn giao ở gốc thông ba nhánh vào đêm rằm.","Đến gốc thông ba nhánh trước rằm để chặn cuộc giao đèn. Bầy quỷ sai áo đen cầm sào tre treo đèn lao ra cản đường.","Kẻ đặt hàng là hồn lão quản tuần rừng, hắn bắt ông Huấn làm đèn cho chủ mình. Hạ hắn, thầy biết đèn sẽ về hội quỷ trong rừng già."]},{"t":"Đèn lồng quỷ hội","n":"Ông Huấn thợ đèn","d":"Cả trăm chiếc đèn lồng tự thắp sáng, kéo nhau về phía rừng già. Mỗi chiếc đèn nhốt một hồn người đi rừng mất tích.","s":["Ông Huấn kể mỗi chiếc đèn ông làm đều bị nhỏ vào một giọt máu người. Đèn tụ về khoảng rừng trống có cây thông chết khô.","Dập từng ngọn đèn để giải thoát hồn bị nhốt. Lửa ma bay thành vòng tròn, đám oan hồn trong lửa rít lên lao vào thầy.","Đèn Lồng Quỷ Vương bùng lên, thân là chiếc đèn giấy đỏ cao bằng ba người. Nó đòi đủ trăm linh hồn để thắp đường cho kẻ nó gọi là Chủ Nhân."],"b":"Đèn Lồng Quỷ Vương","bs":"den_long"},{"t":"Mộ gió đèo Gió","n":"Phu đường Lợi","d":"Trên đèo Gió xuyên rừng có những nấm mộ gió chẳng ai biết của ai. Mấy hôm nay mộ nào cũng nứt toác, sáng ra mặt đường đầy dấu chân trần.","s":["Ông Lợi kể đây là mộ phu làm đường chết vì sập núi, chôn vội không bia. Từ khi có kẻ đào trộm tiền xu chôn theo, mộ bắt đầu nứt.","Chuộc lại tiền xu ở phiên chợ rừng rồi trả về từng mộ. Lũ xác sống cầm cuốc xẻng tràn ra chặn đường lên đèo.","Kẻ đứng sau là hồn tên cai phu năm xưa, kẻ đã đánh phu đến chết. Hắn sai đám phu cũ đi tìm của cho mình, phải đánh hắn tan oán."]},{"t":"Tiếng mõ chùa hoang","n":"Chú tiểu Tâm","d":"Ngôi chùa hoang giữa rừng thông bỗng vang tiếng mõ đều đều mỗi đêm. Chú tiểu Tâm ở chùa Lá gần đó sợ đến mất ngủ.","s":["Trên bậc thềm chùa hoang có bộ áo nâu gấp phẳng phiu của sư Viên Không, người mất tích từ mười năm trước.","Tụng kinh siêu độ ngay trong chính điện đổ nát. Bầy oan hồn chết rừng kéo tới, đập phá đòi được nghe kinh trước.","Hồn sư Viên Không hiện ra, gõ mõ mãi vì chưa tụng xong kinh cho người treo cổ ở gốc đa đầu rừng. Hàng phục để thầy nhận làm thay."]},{"t":"Cây đa thắt cổ","n":"Bà bán hàng xén","d":"Dưới gốc đa đầu rừng, sợi dây thừng cũ vẫn đung đưa dù không có gió. Ai đi ngang lúc chạng vạng đều nghe tiếng gọi tên mình.","s":["Người treo cổ là anh học trò nghèo Lãm, thi hỏng ba lần, bị nhà gái hủy hôn. Trong hốc đa còn tập văn bài anh viết dở.","Cắt sợi dây và đốt tập văn kèm bùa siêu độ. Rễ đa trồi lên kéo theo lũ oan hồn cổ dài ngoằng, lắc lư lao tới.","Hồn anh Lãm hiện ra, mặt tím tái, đòi biết kẻ nào đã đánh tráo bài thi của mình. Thầy đánh tan oán khí rồi hứa tìm ra sự thật."]},{"t":"Trường làng giữa rừng","n":"Cụ lang Thọ","d":"Ngôi trường làng bỏ hoang trong rừng đêm đêm vang tiếng trẻ đọc bài. Trẻ con xóm rừng ngủ dậy đều thuộc làu những câu văn chẳng ai dạy.","s":["Cụ lang nói anh Lãm từng học ở đây với thầy đồ Khiêm. Trong ngăn bàn thầy có xấp bài thi đề tên Lãm nhưng nét bút của người khác.","Đốt hết sách vở ma ám để trẻ xóm rừng tỉnh lại. Lũ oan hồn học trò mặt trắng, tay cầm bút lông nhọn hoắt, xông tới đâm thầy.","Hồn tên thư lại chép bài thuê hiện ra, chính hắn tráo bài anh Lãm theo lệnh thầy đồ. Bị đánh, hắn chạy về hướng mả thầy đồ rồi tan biến."]},{"t":"Án văn thầy đồ Khiêm","n":"Con gái thầy đồ","d":"Thầy đồ Khiêm tráo bài thi của trò nghèo để con nhà giàu đỗ, rồi chết bệnh trong hổ thẹn. Hồn lão không siêu thoát, giam chữ nghĩa cả vùng.","s":["Con gái thầy đồ đưa ra cuốn sổ ghi bạc lão nhận đút lót. Trang cuối có dòng chữ máu: \"Ta sẽ chấm lại tất cả\".","Đến mả thầy đồ đốt cuốn sổ trước khi mặt trời mọc. Đàn oan hồn sĩ tử hỏng thi gào thét, lao ra như mưa mực.","Ông Đồ Mực Máu đứng dậy từ mả, cầm bút son to như ngọn giáo, viết chữ nào hóa xiềng chữ ấy. Lão quyết chấm hỏng cả thầy pháp."],"b":"Ông Đồ Mực Máu","bs":"thay_do"},{"t":"Nấm mọc mặt người","n":"Người hái nấm Đào","d":"Sau mưa, rừng thông mọc đầy nấm trắng có hình mặt người. Ai hái về nấu ăn đều nói mê, kể tên những người đã chết.","s":["Nấm chỉ mọc quanh khu đất trũng có cái lán đổ. Đào kể mùa dịch năm xưa, người bệnh bị đưa vào lán ấy bỏ mặc cho chết.","Rắc vôi và tro hương lên đất trũng để triệt rễ nấm. Lũ xác sống mặt đầy đốm nấm trồi lên khỏi đất, ho khạc lao tới.","Hồn bà lang bị dân buộc ở lại chăm người bệnh rồi chết theo hiện ra. Bà giận cả vùng đã quên mình, phải hàng phục rồi lập miếu thờ."]},{"t":"Bầy quạ báo tang","n":"Sư bà chùa Lá","d":"Quạ đen đậu kín mái chùa Lá, kêu suốt ba ngày không dứt. Dân trong rừng sợ sắp có đại tang, không ai dám ra khỏi nhà.","s":["Dưới tháp chuông có xác quạ xếp thành mũi tên chỉ về phía nam, hướng Đầm Oan Hồn. Sư bà bảo âm khí phía ấy đang dâng lên.","Dựng đàn cầu an giữa sân chùa và giữ lửa đèn suốt đêm. Bầy oan hồn từ phía đầm theo đàn quạ kéo tới, đen kịt cả trời.","Một quỷ sai mang ấn đen lộ diện, chính hắn sai quạ dò đường cho chủ. Hạ hắn, thầy thấy trên ấn khắc hai chữ: Oán Linh."]},{"t":"Vó cá vớt guốc","n":"Ông chài Thiệp","d":"Minh Dạ tới Đầm Oan Hồn. Mấy hôm nay ông Thiệp cất vó không được cá, chỉ toàn tóc rối và guốc gỗ, có đêm vớt cả bàn tay người.","s":["Guốc gỗ khắc chữ Xuân, tên cô đào hát chèo đi thuyền qua đầm rồi đắm cùng cả gánh hát mười năm trước.","Lặn xuống chỗ thuyền gánh hát đắm để vớt chiếc trống chèo. Lũ oan hồn chết đuối trồi lên quanh vó, tóc quấn lấy chân thầy.","Hồn cô đào Xuân hiện ra, hát dở một khúc chèo rồi rít lên đòi kẻ đã đục thuyền. Thầy phải đánh tan oán khí cô mới chịu nghe."]},{"t":"Nhà ông bầu chèo","n":"Cô cháu ông bầu","d":"Ông bầu gánh chèo, người duy nhất sống sót năm thuyền đắm, nay nằm liệt, đêm đêm nghe trống chèo dưới gầm giường. Nhà ngập nước dù trời không mưa.","s":["Cô cháu đưa ra cái dùi đục giấu trong rương. Ông bầu nhận đã đục thuyền để chiếm tiền thưởng, nhưng nói bị một giọng trong sương xúi bảo.","Đem dùi đục ra giữa đầm làm lễ tạ tội. Cả gánh chèo oan hồn trồi lên, mặt bôi phấn trắng, múa may vây chặt thuyền.","Kẻ xúi giục là một quỷ nước đội nón mê, ăn oán khí người chết đuối để lớn lên. Bị đánh, hắn lặn về phía miếu cổ đầm Lau."]},{"t":"Miếu Hà Bá đầm Lau","n":"Trưởng phường chài","d":"Dân đầm Lau xưa phải dâng người sống cho miếu Hà Bá, tục ấy bỏ đã lâu. Nay nước đầm dâng đỏ, quỷ nước đi khắp nơi đòi lại lễ vật cũ.","s":["Trong miếu có tấm bảng gỗ ghi tên những đứa trẻ bị thả trôi làm lễ. Tên quỷ nước nón mê chỉ là kẻ đi gom oán khí cho miếu.","Đập bỏ bàn thờ lễ người sống trong miếu. Lũ oan hồn trẻ bị trói tay níu lấy thầy, cùng bầy quỷ nước trồi lên cản lối.","Lão Hà Bá Đầm Lau trồi lên, thân phủ vảy và rong rêu, râu dài như rễ lau. Lão gầm rằng lễ vật năm nay phải là thầy pháp."],"b":"Lão Hà Bá Đầm Lau","bs":"thuy_quy"},{"t":"Hoa súng nở đêm","n":"Cô hái súng Nhàn","d":"Hoa súng đầm Oan Hồn nở trắng giữa đêm, tỏa hương nồng như trầm. Cô gái nào hái về cắm trong nhà đều mộng du đi ra đầm.","s":["Cô Nhàn tỉnh lại kể trong mơ thấy người mẹ bế con đứng trên lá súng. Gốc súng mọc lên từ chiếc nôi tre chìm dưới bùn.","Kéo chiếc nôi tre lên đem chôn trên đất khô. Lũ oan hồn đầm lầy trồi khỏi bùn, tay chân dài thượt, quấn lấy thầy.","Hồn người mẹ hiện ra, chị bị nhà chồng đuổi khi con mất, ôm nôi ra đầm tự vẫn. Hàng phục rồi chôn nôi cạnh mộ con cho chị yên lòng."]},{"t":"Hồn lính lạc trận","n":"Cụ cựu binh Toại","d":"Tiếng trống trận vọng về từ bãi sậy giữa đầm, nơi xưa kia từng là chiến địa. Đêm đêm có bóng lính áo chàm lội nước, hỏi đường về quê.","s":["Cụ Toại nhận ra đó là toán lính của đội Cảnh, bị bỏ lại giữ đồn khi quân rút. Mặt nước vẫn nổi một lá cờ đội rách tả tơi.","Vớt lá cờ cắm lên gò cao để tập hợp hồn lính. Toán xác sống lính giặc năm xưa trồi lên khỏi bùn, giương giáo gỉ chặn lối.","Hồn đội Cảnh hiện ra, vẫn giữ đồn vì chưa nhận lệnh rút. Phải đánh thắng anh mới chịu nghe lệnh giải ngũ, dẫn quân về quê."]},{"t":"Chợ phiên dưới nước","n":"Bà hàng trầu Cúc","d":"Đêm ba mươi, giữa đầm hiện lên một phiên chợ đèn đuốc sáng trưng, bán đủ thứ bằng vàng mã. Ai mua gì đều phải trả bằng năm năm tuổi thọ.","s":["Bà Cúc lỡ mua một buồng cau, tóc bạc trắng sau một đêm. Buồng cau buộc dây cói, kiểu của chợ Nổi đã chìm khi đê vỡ.","Đem trả buồng cau về đúng gian hàng ma trước khi gà gáy. Đám oan hồn đi chợ quay mặt lại, mắt trắng dã, vây kín lối.","Kẻ đứng sau là hồn tên thu thuế chợ, chết đuối khi đê vỡ vì cố ôm hòm tiền. Hắn vẫn thu thuế người sống, phải đánh tan để trả tuổi cho bà Cúc."]},{"t":"Rễ đen dưới đê","n":"Thợ đắp đê Vững","d":"Bờ đê bao đầm nứt toác chỉ sau một đêm, vết nứt rỉ ra nhựa đen tanh nồng. Nếu đê vỡ, cả xóm Cói sẽ chìm như chợ Nổi năm xưa.","s":["Đào vào vết nứt, thầy gặp rễ cây đen to bằng bắp đùi, ấm như thịt sống. Rễ bò sang từ phía cù lao Đa, cách đó ba dặm.","Chặt đứt rễ chính và yểm bùa giữ đê trước khi triều lên. Lũ oan hồn bị rễ cuốn dưới đáy đầm trồi lên, bết bùn, lao vào thầy.","Một bóng ma mọc ra từ đầu rễ, là người giữ miếu cù lao Đa đã bị cây nuốt. Hắn nói chủ hắn đã thức sau ngàn năm, rồi bị rễ kéo đi mất."]},{"t":"Thụ yêu ngàn năm","n":"Bà thủ miếu cù lao","d":"Rễ cây khổng lồ từ cù lao Đa bò ra tận đường cái, quấn lấy người qua lại. Cây đa ngàn năm vốn hiền, nay hút âm khí dưới đáy đầm mà hóa yêu.","s":["Bà thủ miếu kể có kẻ lạ chôn dưới gốc đa một chiếc bình gốm đen, từ đó lá cây chuyển đỏ. Trong bình là oán khí ủ bằng máu.","Đào chiếc bình gốm đen dưới gốc mà đập vỡ. Rễ cây vung lên, lũ oan hồn bị cây nuốt bao năm vùng ra, tràn tới như thác.","Thụ Yêu Ngàn Năm mở con mắt đỏ giữa thân cây, cành lá rít như tiếng người khóc. Nó gầm rằng Oán Linh Vương đã hứa cho nó cả đầm."],"b":"Thụ Yêu Ngàn Năm","bs":"la_da"},{"t":"Tiếng ru bãi cói","n":"Chị Hiền mới sinh","d":"Đứa con đỏ hỏn của chị Hiền đêm nào cũng khóc thét lúc canh hai, rồi tự nín khi có tiếng ru vọng từ bãi cói. Sáng ra, cổ tay bé hằn vết tay lạnh.","s":["Lời ru là bài hát riêng của bà Nhị, bà đỡ trong xóm, chết đuối năm ngoái khi chèo thuyền đi đỡ đẻ giữa đêm bão.","Mang lễ và chiếc kéo cắt rốn của bà Nhị ra bãi cói để hồn bà nhận lại. Đám oan hồn chết yểu lổm ngổm bò ra, khóc ré cản đường.","Hồn bà Nhị hiện ra, muốn giữ đứa bé vì đêm bão bà không cứu kịp mẹ con nhà nọ. Hàng phục rồi khuyên bà buông tay cho bé lớn lên."]},{"t":"Thuyền giấy trôi ngược","n":"Thầy giáo làng Định","d":"Ngày rằm, thuyền giấy thả trôi cúng vong lại trôi ngược vào bờ, trên mỗi thuyền có một nắm đất đỏ. Người xóm Cói sợ, không dám thả nữa.","s":["Đất đỏ là đất Gò Sắt bên kia đầm, nơi chôn chung phu đào kênh. Thầy giáo Định tìm được tên họ trong cuốn sổ phu cũ.","Chở hương hoa tới Gò Sắt dựng lại bia tên cho từng người. Lũ xác sống cầm mai thuổng trồi lên, đòi tiền công chưa trả.","Hồn viên ký lục kênh lộ diện, hắn ăn bớt tiền công rồi đổ cho phu bỏ trốn. Đánh tan hắn, sổ công thật mới hiện ra."]},{"t":"Sương tím giờ Dậu","n":"Cô lái đò Liễu","d":"Cứ giờ Dậu, một làn sương tím phủ kín đầm Oan Hồn, ai hít phải đều ho ra nước bùn. Đò không dám đi, xóm Cói bị cắt khỏi bên ngoài.","s":["Sương bốc lên từ những chum sành chôn ngược quanh cồn Lác. Chum nào cũng dán bùa đen, nét ấn y hệt ấn Oán Linh của tên quỷ sai ở chùa Lá.","Đập vỡ từng chum sành quanh cồn Lác khi sương còn mỏng. Bầy oan hồn bị nhốt trong chum ùa ra, hóa điên lao vào thầy.","Kẻ canh chum là quỷ sai đeo mặt nạ đồng, hắn cười bảo đây chỉ là một trong trăm cái miệng thở của chủ hắn. Phải hạ hắn mới tan được sương."]},{"t":"Thuyền nan mất lái","n":"Ông lái đò Sáu Nhỏ","d":"Ở bến Lác, ba chiếc thuyền nan đi cắt cỏ năn từ chiều không về, sáng ra chỉ thấy thuyền trôi không người, mái chèo còn ướt. Đầu đầm, sương trắng bắt đầu dày lên dù trời chưa vào đông.","s":["Ông Sáu kể cả ba người đều nghe tiếng gọi tên mình từ trong sương. Thầy tìm thấy trên mạn thuyền vết tay ướt nhỏ xíu, lạnh như nước giếng, in theo chiều kéo xuống.","Phải đốt bó lá ngải ở mũi thuyền rồi chèo vào lạch Cái Sậy theo dấu tay. Oan hồn và ma trơi trồi lên từ bùn, níu mái chèo không cho thuyền đi tiếp.","Cuối lạch là một đứa bé hồn ma ôm chiếc nón lá rách, nó chỉ là kẻ dẫn đường. Nó khóc rằng có một người chị trong sương sai nó gọi người về, rồi tan vào màn trắng."]},{"t":"Sương mù nuốt người","n":"Bà Tư bán khô","d":"Màn sương trắng đặc từ lòng đầm Lác tràn lên bờ, ai lạc vào đều không thấy trở ra. Trong sương có tiếng hát ru và mùi hoa súng nồng đến buồn nôn.","s":["Bà Tư nói hai mươi năm trước, cô Hạnh con ông chủ ghe bị cha ép gả, nhảy xuống đầm trong đêm sương. Thầy tìm được nhành hoa súng khô kẹp trong gốc tràm đầu bến.","Phải cắm đủ bảy lá bùa trấn yểm quanh bờ đầm để vạch lối trong sương. Quỷ sai và oan hồn những người bị nuốt trước đó lao ra, mắt trắng dã như sương.","Nàng Sương Bến Lác hiện ra, áo trắng ướt sũng, tóc kết đầy rong. Nàng giữ người lại vì không muốn ai bị bỏ một mình trong lạnh như nàng, và nàng không nghe khuyên nữa."],"b":"Nàng Sương Bến Lác","bs":"ao_trang"},{"t":"Xích đen dưới đáy đầm","n":"Anh mò hến Tám","d":"Sương tan, mười một người mất tích được tìm thấy nằm mê man trên bãi sậy. Nhưng mực nước đầm Lác vẫn sủi bọt đen, và cá chết nổi trắng cả một khúc.","s":["Anh Tám mò hến chạm phải một sợi xích sắt đen ở đáy đầm, khắc chữ Oán. Thầy nhận ra đây là xích trói hồn, thứ chỉ quỷ sai âm phủ mới mang theo.","Phải lặn xuống kéo sợi xích lên và chặt nó trên đá mài. Một toán quỷ sai xác ướt bùn từ đáy đầm trồi lên giành lại xích, tiếng xích kéo vang lạnh gáy.","Kẻ canh xích là một quỷ sai đội mũ cao, mặt dán giấy vàng. Trước khi tan, hắn cười khàn: Vương đã thức, sương đầm Lác chỉ là một ngón tay của ngài."]},{"t":"Mộ vô danh kêu đói","n":"Cụ từ giữ đình Hòa","d":"Rời đầm, đoàn tới Nghĩa Địa Cổ của làng Hòa Mỹ. Đêm đêm, dãy mộ đất không bia ở rìa bãi tha ma vang tiếng gõ bát, tiếng ai đó kêu đói, lũ trẻ trong làng sốt mê man.","s":["Cụ từ kể năm đói Ất Dậu, làng chôn vội cả trăm người không ai nhận. Thầy tìm thấy những chiếc bát sành sứt mẻ úp trên mộ, đáy bát còn dính hạt cơm khô.","Phải nấu nồi cháo thí và rải gạo muối khắp dãy mộ vô danh. Oan hồn đói lả bị kẻ khác xúi giục, ùa ra giật nồi, kéo theo cả xác sống gầy trơ xương.","Kẻ đứng sau là hồn ma tên cai Lộc, xưa giữ kho thóc của làng mà để người chết đói. Hắn vẫn ôm chìa khóa kho, bắt các hồn đói phải hầu hạ hắn mới được ăn."]},{"t":"Kẻ trộm mộ mất hồn","n":"Chị bán hoa Lài","d":"Hai gã trộm mộ đào vào khu mộ gạch nhà họ Trịnh, sáng ra một gã chết cứng ôm chiếc trâm vàng, gã kia đi lang thang miệng cứ đếm số không ngừng.","s":["Chị Lài nghe gã điên đếm tới chín mươi chín rồi lại bắt đầu lại. Thầy tìm thấy cửa mộ bị cạy, bên trong có dấu bàn tay đen in lên quan tài, không phải tay người.","Phải trả chiếc trâm vàng về đúng quan tài và trát lại cửa mộ trước giờ Tý. Ma trơi và quỷ sai từ những hố mộ bị đào dở bò ra ngăn cản.","Lộ diện là hồn bà Trịnh, chủ chiếc trâm, giận vì bị quấy giấc. Bà tiết lộ có kẻ mặc áo xám đã xui bọn trộm đến đây, để oán khí trong mộ dâng lên."]},{"t":"Kiệu hoa không người khiêng","n":"Bà mai Hạ","d":"Canh ba, một chiếc kiệu cưới đỏ thắm lững lờ đi giữa các hàng mộ nghĩa địa Hòa Mỹ, kèn đám cưới thổi mà không thấy ai khiêng. Sáng ra, trên mộ cô Nguyệt rải đầy xác pháo hồng.","s":["Bà mai Hạ thú nhận nhà phú hộ Đoàn từng đặt lễ minh hôn, cưới hồn cô Nguyệt cho cậu con trai chết yểu. Thầy tìm được tờ hôn thư viết bằng mực son trên mộ cô.","Phải đuổi theo kiệu và xé tờ hôn thư trước khi kiệu vào lăng họ Đoàn. Đội rước dâu toàn xác sống mặc áo the và oan hồn cầm đèn lồng xông ra chặn đường.","Trong kiệu là hồn cô Nguyệt, bị trói bằng dải lụa đỏ. Cô khóc kể chưa từng ưng thuận, và người ép cô vẫn ngồi chờ trong lăng: lão phú hộ Đoàn đã chết mà không chịu nằm yên."]},{"t":"Lăng đá họ Đoàn","n":"Cô Nguyệt (hồn ma)","d":"Lăng họ Đoàn xây bằng đá xanh giữa nghĩa địa, cửa lăng mở he hé mỗi đêm. Mùi trầm và mùi xác thối lẫn vào nhau, chó trong làng tru suốt từ chập tối.","s":["Cô Nguyệt chỉ thầy cửa sau của lăng, nơi lão Đoàn chôn cả hũ bạc để mang theo xuống âm phủ. Thầy tìm thấy hũ bạc đã bị khoét, dán bùa ngược màu đen.","Phải gỡ bùa ngược trên tám cây cột lăng để phá thế giữ xác. Gia nhân xác sống của họ Đoàn và quỷ sai giữ cửa ào ra, tay vẫn bưng mâm cỗ cưới.","Lão Phú Hộ Đoàn bật nắp quan tài, da khô như giấy bản, móng tay dài cong. Lão giữ xác không rữa nhờ bùa ngược của kẻ áo xám, đổi lại là giao nộp hồn con gái làng."],"b":"Lão Phú Hộ Đoàn","bs":"cuong_thi"},{"t":"Nén hương cháy ngược","n":"Chú thợ đá Bảy","d":"Ở khu mộ mới của làng Hòa Mỹ, hương cắm lên mộ cứ cháy từ chân lên đầu, khói bay xuống đất thay vì bay lên trời. Người đi tảo mộ về đều bị ác mộng thấy mình bị chôn sống.","s":["Chú Bảy khắc bia kể có người lạ đến đặt mua hàng loạt bia trống tên. Thầy tìm ra dưới chân bia mới có lớp tro đen trộn tóc người, làm thành trận hút khí.","Phải đào lớp tro đen ở chín ngôi mộ và rải vôi bột lên. Ma trơi bị trận hút về bay rợp trời, oan hồn chưa siêu thoát xông vào cào cấu thầy.","Người đặt bia hóa ra là hồn ma thầy địa lý Kha, bị kẻ áo xám mua chuộc bằng lời hứa cho đầu thai làm quan. Hắn bày trận để nuôi một thứ gì đó ở xa phía bắc."]},{"t":"Người giữ nghĩa trang","n":"Bé Cúc chăn vịt","d":"Ông Ba Lù giữ nghĩa trang Hòa Mỹ bốn mươi năm bỗng biến mất, túp lều canh còn ấm lửa. Đêm đến, người ta vẫn thấy ánh đèn bão của ông đi quanh các hàng mộ.","s":["Bé Cúc kể ông Ba hay kể chuyện cho các hồn ma để họ khỏi buồn. Thầy tìm thấy chiếc đèn bão của ông treo trên cành gạo, bấc đèn cháy lửa xanh.","Phải mang đèn đi theo vòng tuần đêm của ông Ba, qua đủ mười hai hàng mộ. Oan hồn mất người trò chuyện nổi giận, cùng xác sống ngăn không cho đèn đi tiếp.","Hồn ông Ba Lù hiện ra, ông đã chết từ đêm trước vì một bóng áo xám xô ông ngã xuống huyệt. Ông không chịu đi vì sợ các hồn ma ở đây sẽ bị kẻ đó dắt đi mất."]},{"t":"Bầy quạ mỏ trắng","n":"Anh thợ cày Tâm","d":"Một bầy quạ mỏ trắng đậu kín cây gạo giữa nghĩa địa, đêm nào cũng kêu đủ mười tiếng rồi im bặt. Sáng ra, trong làng lại có một người già ra đi trong giấc ngủ.","s":["Anh Tâm đếm được đã có bảy cụ già mất theo tiếng quạ. Thầy trèo lên cây gạo, tìm thấy tổ quạ lót bằng giấy tiền âm phủ, viết tên những người sắp chết.","Phải đốt sạch những tổ quạ trước canh tư. Bầy quạ hóa thành oan hồn cánh đen sà xuống, ma trơi bốc lên từ gốc cây che kín đường leo.","Kẻ chăn quạ là một quỷ sai lén câu hồn sớm, ghi tên người sống vào sổ để nộp đủ số cho chủ. Hắn chỉ biết chủ mình là Vương, đang cần thật nhiều hồn người."]},{"t":"Tiếng chuông chùa hoang","n":"Sư bà chùa Lá","d":"Chùa Đồng Vân ở cuối nghĩa địa đã bỏ hoang trăm năm, bỗng mỗi đêm lại vang tiếng chuông đồng. Ai nghe đủ ba hồi đều lên cơn sốt, nói mê toàn kinh đọc ngược.","s":["Sư bà kể xưa chùa bị cướp phá, các vị sư bị giết ngay trước gác chuông. Thầy tìm thấy dây kéo chuông mới tinh bện bằng tóc, quấn chặt quanh cột gỗ mục.","Phải leo lên gác chuông cắt sợi dây tóc và trát bùa lên miệng chuông. Oan hồn những kẻ cướp năm xưa và quỷ sai giữ chùa ùa ra cản trên cầu thang gỗ mục.","Người kéo chuông là hồn vị sư trụ trì, bị trói vào cột bằng xích đen. Ngài nói ngài không ngừng kéo được, vì có một kẻ đang canh trong chính điện bắt ngài phải kéo."]},{"t":"Võ tăng giữ chùa","n":"Hồn sư trụ trì","d":"Trong chính điện chùa Đồng Vân, tượng Hộ Pháp bị đập vỡ, thay bằng một bóng người khổng lồ cầm thiết côn. Mỗi tiếng côn gõ xuống nền là một ngôi mộ quanh chùa nứt toác.","s":["Sư trụ trì kể vị võ tăng Không Lực xưa đã một mình giữ cổng chùa chống bọn cướp tới chết. Thầy tìm thấy chuỗi tràng hạt của ông bị đứt, hạt rơi vãi quanh bậc thềm.","Phải nhặt đủ một trăm lẻ tám hạt tràng và xâu lại để gọi tỉnh võ tăng. Oan hồn bọn cướp và quỷ sai mặt đen lao vào giành giật từng hạt.","Võ Tăng Không Lực hiện thân, mắt đỏ ngầu, cổ đeo xích đen. Kẻ áo xám đã nói dối ông rằng chùa sắp bị cướp lần nữa, khiến ông đánh bất kỳ ai dám bước vào."],"b":"Võ Tăng Không Lực","bs":"vo_si"},{"t":"Sổ bộ bị xé","n":"Thầy cúng Vĩnh","d":"Ở đền Thổ Địa cuối nghĩa địa, quyển sổ bộ ghi tên người chết của cả vùng bị xé mất mấy chục trang. Từ đó, hồn người mới mất cứ quanh quẩn ở cổng, không có tên để đi.","s":["Thầy cúng Vĩnh nhận ra nét xé thẳng như dao cắt. Thầy tìm thấy một mảnh giấy rơi lại có dấu ấn hình con mắt đen, thứ dấu mà dân gian gọi là ấn Oán Linh.","Phải lần theo vệt mực loang trên đất tới ngôi mộ đá bị bỏ hoang. Ma trơi và oan hồn không tên vây kín ngôi mộ, kéo thầy về phía chúng đòi trả tên.","Trong mộ là một quỷ sai áo xám đang chép tên người chết sang cuốn sổ đen. Hắn bỏ chạy để lại nửa cuốn sổ, trang cuối ghi: dâng về Quỷ Môn Quan."]},{"t":"Lăng ông Thượng thư","n":"Lý trưởng Hòa","d":"Lăng của quan Thượng thư Lê Khiêm, người được dân làng thờ vì làm đê ngày trước, bỗng phát ra tiếng tranh cãi mỗi đêm. Đê sông bên làng bắt đầu rỉ nước dù trời không mưa.","s":["Lý trưởng Hòa kể có người đã đục mất tấm bia công đức của quan. Thầy tìm thấy tấm bia bị vứt dưới mương, phần tên ông bị đục nát, thay bằng chữ khác.","Phải đưa tấm bia về và dựng lại trước cửa lăng. Một toán quỷ sai và xác sống vác bia giả xông ra, muốn chiếm lăng làm chốn đóng quân.","Kẻ đứng sau là hồn tên quan tham Bùi Tịch, kẻ từng cướp công làm đê. Hắn được kẻ áo xám đưa lên, muốn thay tên mình vào bia để hưởng hương khói của làng."]},{"t":"Đứa trẻ chơi trên mộ","n":"Mẹ Tí bán xôi","d":"Mấy đứa trẻ làng Hòa Mỹ cứ chiều tà lại rủ nhau ra nghĩa địa chơi ô ăn quan với một bạn mới. Đã ba đứa đi không về, chỉ còn lại những viên sỏi trắng.","s":["Mẹ Tí kể bạn mới ấy mặc áo đỏ, không bao giờ để ai thấy chân. Thầy tìm thấy bàn ô ăn quan vẽ trên một nấm mộ trẻ con, những viên sỏi lạnh buốt.","Phải chơi một ván ô ăn quan và thắng để đổi lại ba đứa trẻ. Ván chưa xong, oan hồn và ma trơi nổi lên giành sỏi, muốn bắt thêm người làm bạn.","Bạn áo đỏ là hồn bé Sen, chết đuối năm bảy tuổi, chỉ muốn có người chơi cùng. Nhưng sau lưng em là một bóng áo xám dạy em cách giữ hồn trẻ con lại."]},{"t":"Mộ đá đôi","n":"Anh chàng tiều Khang","d":"Ở góc nghĩa địa có cặp mộ đá đôi của một đôi vợ chồng chết cùng ngày. Gần đây, trai làng cứ ra đó thắp hương là về mê mẩn, bỏ ăn bỏ ngủ, mắt nhìn xa xăm.","s":["Anh Khang suýt bị mê, kịp nhớ ra mùi hương lạ ngọt lịm. Thầy tìm thấy những sợi lông trắng muốt mắc trên bia mộ, lẫn dấu chân cáo đi quanh mộ.","Phải giải bùa mê cho năm chàng trai đang nằm mê man trong đình. Oan hồn bị sai khiến và xác sống của những người đã chết vì mê lao ra quấy phá lễ giải.","Hồn đôi vợ chồng hiện về báo rằng mộ họ bị chiếm làm hang. Một con cáo đã nhiều đuôi vào ở trong đó, và đêm đến nó đội lốt người vợ để dụ trai làng."]},{"t":"Cửu vĩ hồ ly","n":"Ông lão bắt rắn","d":"Con cáo chín đuôi hóa thành thiếu nữ, lấy mộ đá đôi làm hang để mê hoặc trai làng. Ánh trăng đêm rằm soi xuống nghĩa địa thấy chín cái bóng đuôi phe phẩy trên mặt mộ.","s":["Ông lão bắt rắn kể hồ ly này đã tu trăm năm, chỉ thiếu hồn người để đắc đạo. Thầy tìm được chiếc gương đồng nhỏ của người vợ, soi vào thì lộ chân cáo.","Phải mang gương đồng tới mộ đá đôi đúng giờ trăng lên đỉnh. Oan hồn những chàng trai bị mê và quỷ sai trung thành với hồ ly ào ra cản lối.","Cửu Vĩ Hồ Ly hiện nguyên hình, chín đuôi vung như chín ngọn lửa. Nó cười rằng Vương hứa cho nó hồn đủ một nghìn trai làng để thành tiên."],"b":"Cửu Vĩ Hồ Ly","bs":"ho_ly"},{"t":"Vàng mã đốt không cháy","n":"Bà cụ bán vàng mã","d":"Hồ ly tan, nhưng cả làng Hòa Mỹ đốt vàng mã cúng rằm thì giấy không cháy, bốc khói đen kịt. Người âm không nhận được gì, đêm đêm về gõ cửa xin tiền.","s":["Bà cụ bán vàng mã nhận ra mẻ giấy nhập từ một lái buôn lạ mặt. Thầy xé ra, thấy giữa các lớp giấy có chữ phù đen, biến tiền cúng thành vàng nộp cho kẻ khác.","Phải gom hết vàng mã nhiễm phù đem ra bãi sông đốt bằng lửa đèn chùa. Ma trơi và quỷ sai lao đến dập lửa để giữ phần cống nạp của chúng.","Lái buôn lạ mặt chính là quỷ sai áo xám. Hắn bỏ chạy về phía Núi Quỷ Khốc, nơi khói đen bốc cuồn cuộn trên những vách đá dựng đứng."]},{"t":"Bia mộ rỉ máu","n":"Ông kiểm lâm Đỗ","d":"Dưới chân Núi Quỷ Khốc có dãy bia đá của những dân phu chết khi mở đường qua đèo Hắc Phong. Nay các tấm bia rỉ ra dòng nước đỏ như máu, chảy thành vệt xuống suối.","s":["Ông Đỗ kể dân phu xưa bị đốc công đánh chết rồi chôn ngay bên đường. Thầy nếm thử thì thấy nước tanh vị sắt, và dưới mỗi bia là một cái đinh đen đóng sâu.","Phải nhổ đủ ba mươi sáu cái đinh đen dưới bia trước khi trời sáng. Oan hồn dân phu bị đinh kích động và xác sống mang cuốc xẻng ào ra tấn công.","Kẻ đóng đinh là hồn đốc công Hắc, kẻ ác xưa, nay được quỷ sai áo xám dùng đinh đen giữ oan khí dân phu lại làm sức mạnh cho đường lên núi."]},{"t":"Đường đèo xương trắng","n":"Chị gánh muối Hoa","d":"Đèo Hắc Phong là đường duy nhất qua núi, nhưng mấy tuần nay đầy xương trắng tự xếp chắn ngang lối. Ai gỡ xương ra, sáng hôm sau lại thấy chúng xếp nguyên chỗ cũ.","s":["Chị Hoa gánh muối thấy xương xếp thành hình mũi tên chỉ lên đỉnh núi. Thầy nhận ra đây là xương của người bị lạc, đang muốn cảnh báo người sống đừng đi tiếp.","Phải gom xương về chôn cất tử tế ở chân đèo và làm lễ cầu siêu. Một toán quỷ sai và xác sống từ trên núi đổ xuống, không muốn những hồn ấy được yên.","Một hồn lính thú già hiện ra cảm ơn, kể trên đỉnh có trại sơn tặc chết từ trăm năm vẫn còn chặn đèo. Bọn chúng mới có thêm sức mạnh từ một kẻ áo xám."]},{"t":"Trại sơn tặc bỏ hoang","n":"Anh thợ săn Mạnh","d":"Trên sườn núi có trại sơn tặc bỏ hoang từ trăm năm, nay đêm nào cũng có lửa trại và tiếng chè chén. Lữ khách đi đêm qua đó bị cướp sạch, có người mất cả hồn.","s":["Anh Mạnh kể đã thấy những tên cướp lưng đeo đao rỉ, mặt xanh như tàu lá. Thầy tìm thấy lá cờ đen mới cắm trên chòi canh, vẽ con mắt giống dấu ấn Oán Linh.","Phải lẻn vào trại hạ lá cờ đen và đốt nó đi. Oan hồn sơn tặc tay sai và ma trơi lửa trại tràn ra như ong vỡ tổ, chặn lối vào sâu trong trại.","Phó đảng hồn ma cười khẩy: lá cờ chỉ là lời hẹn. Chúa đảng đã chịu quỳ dưới cờ Vương, đổi lấy quyền giữ đèo, và đang chờ thầy ở hang Đá Ngựa."]},{"t":"Chúa đảng Đèo Mây","n":"Hồn lính thú già","d":"Hang Đá Ngựa trên đỉnh đèo vang tiếng trống trận, gió lạnh thốc ra mang theo mùi rượu và máu khô. Từ khi cờ đen cắm lên, cả vùng núi không ai dám đi qua.","s":["Hồn lính thú kể Chúa đảng Hổ Đồ xưa bị quan quân vây chết đói trong hang, oán thù cả thiên hạ. Thầy tìm được thanh đao gãy của hắn cắm trước cửa hang.","Phải đập vỡ chiếc trống trận bằng da trâu đen để phá thế quân. Bọn sơn tặc hồn ma và quỷ sai mang xích đen xông ra bảo vệ trống.","Chúa Đảng Hổ Đồ hiện thân, vai vác đại đao, cổ đeo bùa cờ đen. Hắn gầm rằng thiên hạ bỏ hắn chết đói, nên giờ hắn sẽ đứng về phía kẻ có thể mở cửa âm phủ."],"b":"Chúa Đảng Hổ Đồ","bs":"geroh"},{"t":"Ông đồ chưa viết xong","n":"Cậu học trò Văn","d":"Trong miếu đá lưng chừng núi, hồn ông đồ Phan mỗi đêm ngồi viết câu đối mãi không xong. Ai đi qua đều nghe tiếng mài mực sột soạt, và mất luôn chữ trong đầu.","s":["Cậu Văn kể học trò dưới làng nay không nhớ nổi một chữ nào. Thầy tìm thấy nghiên mực của ông đồ đã khô cong, bên cạnh vế trên viết dở: Núi khóc ngàn năm...","Phải tìm thỏi mực tàu ông đồ đánh rơi ở khe đá và mài cho ông viết tiếp. Oan hồn và quỷ sai vây lấy miếu, chúng cần ông đồ không bao giờ viết xong.","Ông đồ Phan hiện ra, nói ông chết trong bão tuyết trên đường đi thi. Vế dưới bị một kẻ áo xám lấy mất, vì câu đối ấy vốn là bùa trấn yểm cả ngọn núi."]},{"t":"Mỏ than sập","n":"Bà góa thợ mỏ","d":"Mỏ than Hố Đen sập từ ba mươi năm trước, vùi chín người thợ. Nay đêm đêm từ cửa mỏ vẳng ra tiếng cuốc chim gõ vào đá, như người bên trong vẫn đang đào lối ra.","s":["Bà góa kể chủ mỏ đã cho lấp cửa để giấu tai nạn. Thầy áp tai vào vách đá, đếm được đúng chín nhịp gõ, và tìm thấy chiếc nón sắt có tên chồng bà.","Phải đào thông lại cửa mỏ để đưa hài cốt chín người ra. Xác sống thợ mỏ bị oán khí xui khiến cùng ma trơi lửa than chặn kín đường hầm.","Kẻ đứng sau là hồn chủ mỏ họ Lương, kẻ đã lấp mỏ. Hắn tự trốn trong hầm, giữ chín người thợ để đào hộ hắn một đường xuyên núi cho bọn áo xám."]},{"t":"Tiếng sáo trên vách đá","n":"Cô hái chè Mai","d":"Mỗi chiều sương, trên vách đá Vọng Phu vang tiếng sáo trúc buồn não ruột. Ai nghe theo tiếng sáo leo lên đều bị trượt chân rơi xuống vực, đã ba người.","s":["Cô Mai kể chàng thổi sáo tên Lâm xưa đứng đây chờ người yêu đi lính không về. Thầy tìm thấy cây sáo trúc nứt dọc, bị buộc dải vải đen khắc chữ Oán.","Phải tháo dải vải đen và dựng lại lan can đá trên vách. Oan hồn những người rơi vực và quỷ sai trồi lên từ dưới khe, túm chân lôi người xuống.","Hồn chàng Lâm hiện ra, không hề muốn hại ai. Dải vải đen của kẻ áo xám đã biến tiếng sáo nhớ thương của chàng thành tiếng gọi chết người."]},{"t":"Dấu chân báo đá","n":"Già làng Pao","d":"Trên đá vôi núi Quỷ Khốc in những dấu chân báo to bằng cái nia, còn bốc hơi lạnh. Đàn dê của bản Lũng Sương mất dần từng con, chỉ để lại vệt máu trên tuyết.","s":["Già Pao kể xưa có con báo mun linh thiêng giữ núi, bị thợ săn bẫy chết. Thầy tìm thấy cái bẫy sắt cũ, răng bẫy còn kẹp mấy sợi lông đen óng ánh.","Phải phá cái bẫy sắt và rải muối quanh bản để chặn đường báo đi. Ma trơi và oan hồn bị oán khí của báo kéo theo xông vào bản ngay lúc nửa đêm.","Một hồn thợ săn hiện ra, thú nhận chính anh đặt bẫy năm xưa. Hồn báo nay đã không còn giữ núi, nó đang ăn hồn để mạnh thêm trong hang Gió Lùa."]},{"t":"Báo mun hang Gió","n":"Hồn thợ săn","d":"Hang Gió Lùa thổi ra luồng gió lạnh cắt da, nghe như tiếng gầm gừ. Từ khi báo mun thức dậy, đàn gia súc khắp ba bản đều chết rét, bản làng không ai dám ra rừng.","s":["Hồn thợ săn chỉ đường vào hang, kể báo giờ đeo một vòng cổ xích đen. Thầy tìm thấy trên vách hang chi chít vết cào như đếm ngày, cùng ấn con mắt đen.","Phải thắp đèn mỡ ở ba ngã rẽ hang để tránh bị báo phục kích. Oan hồn thú rừng và quỷ sai lao ra từ bóng tối, tiếng chân đá lở rào rào.","Báo Mun Hang Gió nhảy xuống từ trần hang, mắt xanh lè. Nó từng là thần giữ núi, nay chỉ còn oán hận loài người, và chiếc vòng xích của Vương thắt chặt lấy nó."],"b":"Báo Mun Hang Gió","bs":"jaguar"},{"t":"Quan tài trôi sông","n":"Ông chài Khuê","d":"Ba cỗ quan tài sơn son từ thượng nguồn suối Đá Đen trôi về bến Thác Trắng, nắp đã bật mở, bên trong trống trơn. Đêm ấy, ba nhà trong bản có người ốm liệt giường.","s":["Ông Khuê vớt quan tài lên, thấy mặt trong cào xước như có người cố thoát ra. Thầy tìm thấy trên nắp dấu ấn của dòng họ Tạ, những người chôn quan tài treo vách núi.","Phải ngược suối đưa ba quan tài về vách treo của họ Tạ. Xác sống thoát ra từ quan tài và oan hồn dưới thác chặn ngang lối đi trơn tuột.","Ba hồn họ Tạ hiện ra, kể vách treo bị một kiếm khách áo đen chém đứt dây. Hắn lùng tìm thứ gì đó trong các cỗ quan tài treo, bất kể người chết."]},{"t":"Vách quan tài treo","n":"Cụ trưởng họ Tạ","d":"Vách núi họ Tạ treo hàng trăm cỗ quan tài trên giá gỗ, nay nhiều giá bị chém gãy. Gió lùa qua những khe quan tài vỡ phát ra tiếng như người rên rỉ suốt đêm.","s":["Cụ trưởng họ Tạ kể trong vách có cỗ quan tài giữ thanh kiếm của tổ tiên. Thầy leo lên, thấy vết chém sạch như cắt bột, đều cùng một kiếm pháp.","Phải leo vách buộc lại dây cho những cỗ quan tài còn treo. Oan hồn họ Tạ bị khuấy giấc và ma trơi bám vách lao xuống quấy, đá lở rơi rào rào.","Hồn tổ tiên họ Tạ hiện thân, báo rằng thanh kiếm đã mất. Kẻ lấy là một kiếm khách áo đen, hắn đi theo một kẻ áo xám mang cờ con mắt."]},{"t":"Bóng người áo đen","n":"Chị bán rượu ngô","d":"Ở quán rượu ngô dưới chân đèo, khách say kể đêm nào cũng thấy bóng kiếm khách áo đen đứng trên mỏm đá nhìn xuống. Sáng hôm sau, ai nhìn thẳng hắn đều bị cắt một lọn tóc.","s":["Chị bán rượu kể hắn từng đến quán, gọi một vò rượu cho hai người dù chỉ đi một mình. Thầy tìm thấy chiếc chén thứ hai, đáy chén khắc tên một người: Tuấn.","Phải lần theo dấu lọn tóc bị cắt treo trên cành thông lên mỏm đá. Quỷ sai và oan hồn những kẻ thách đấu bị hắn chém trước đó cản đường thầy.","Trên mỏm đá chỉ còn một hồn ma kiếm sĩ trẻ tên Tuấn. Cậu kể kiếm khách áo đen từng là sư huynh mình, đã giết cậu vì một lời hứa với Vương."]},{"t":"Kiếm gãy dưới vực","n":"Hồn kiếm sĩ Tuấn","d":"Dưới vực Sầu Đá có hàng chục thanh kiếm gãy cắm ngược, mỗi thanh của một người thua trận. Đêm trăng, các thanh kiếm rung lên kêu như tiếng khóc.","s":["Tuấn kể sư huynh Khải sau khi thua một trận vì bị chơi xấu đã nguyện thắng tất cả. Thầy tìm thấy chiếc dải đầu của võ đường hai người, đã nhuộm đen.","Phải nhổ những thanh kiếm gãy và chôn cạnh hài cốt chủ của chúng. Oan hồn kiếm khách bại trận và quỷ sai lao ra, muốn giữ những thanh kiếm làm binh khí.","Một hồn ma võ đường hiện ra báo tin: Khải đã đổi hồn mình lấy kiếm pháp từ Vương. Giờ hắn chặn ngay cửa đèo, chờ người cuối cùng dám đi qua."]},{"t":"Hắc kiếm ma","n":"Ông lão trà đá","d":"Một bóng kiếm khách áo đen chặn ngay cửa đèo Gió Cắt, thách đấu mọi người qua lại. Kẻ nào thua bị chém mất bóng, rồi lặng lẽ héo mòn mà chết.","s":["Ông lão kể đã thấy hắn rút kiếm mà không thấy kiếm, chỉ thấy gió đen. Thầy tìm được mảnh dải đầu đen thứ hai, bên trong khâu tên Tuấn bằng chỉ trắng.","Phải mang thanh kiếm tổ họ Tạ trả về đúng chủ để phá kiếm khí. Quỷ sai đeo xích đen và oan hồn kiếm khách bại trận dựng thành hàng chắn đèo.","Hắc Kiếm Ma rút thanh kiếm đen, giọng Khải ngày xưa còn vương lại. Hắn nói chỉ cần thắng thầy, Vương sẽ trả hắn trận đấu năm xưa, và lần này hắn sẽ không thua."],"b":"Hắc Kiếm Ma","bs":"kiem_si"},{"t":"Phong thư của sứ giả","n":"Hồn kiếm sĩ Tuấn","d":"Hắc Kiếm Ma ngã xuống, gió đèo Gió Cắt bỗng lặng như tờ. Tuấn ở lại tiễn sư huynh, nhưng trong áo Khải rơi ra một phong thư niêm sáp đen còn ấm.","s":["Tuấn cùng thầy mở thư, thấy lời triệu tập ký bằng ấn con mắt đen: mọi kẻ đã nhận xích phải về chân núi Quỷ Khốc vào đêm không trăng. Kèm theo là một sợi tóc xám.","Phải đến điểm hẹn dưới chân núi trước đêm không trăng để phá lễ hội quân. Quỷ sai và xác sống tay sai của Vương đã tề tựu, ùa ra khi thấy thầy.","Kẻ áo xám mà thầy theo dấu suốt từ đầm Lác cuối cùng lộ mặt: hắn là sứ giả của Oán Linh Vương. Hắn cười rồi biến vào vách đá, để lại tiếng khóc của cả ngọn núi."]},{"t":"Đèo Gánh Muối","n":"Ông phu muối Tư","d":"Phu gánh muối qua đèo Ba Khúc lần lượt mất tích. Đêm đêm trên đèo vang tiếng đòn gánh kẽo kẹt mà không thấy ai.","s":["Ông Tư chỉ cho thầy vệt muối rải dọc vách đá, dẫn tới khe núi có một đôi quang gánh mục và dấu chân không gót.","Phải lật tảng đá lở đè trên khe để đưa hài cốt người phu xấu số lên. Oan hồn mặt trắng muối ùa ra, kéo chân thầy xuống vực.","Hồn phu Cả Lộc hiện ra, oán bạn đồng hành bỏ mặc mình dưới đá lở năm ấy. Hắn gọi người qua đèo để có kẻ gánh thay."]},{"t":"Cầu mây đứt dây","n":"Bà mế bán chè","d":"Chiếc cầu mây bắc qua vực Sâu Mười Trượng cứ nửa đêm lại tự đứt một sợi. Người bản không dám sang chợ phiên, lúa gạo cạn dần.","s":["Bà mế kể mùa trước có cô dâu rơi xuống vực ngay ngày cưới. Thầy tìm thấy trên dây cầu một sợi chỉ đỏ quấn kéo chặt như dao.","Phải buộc lại sợi dây chính và dán bùa trấn yểm ở hai đầu cầu. Ma trơi bay lên từ đáy vực, đốt rụi từng nút buộc.","Hồn cô dâu A Mai hiện lên trong áo cưới ướt sũng. Cô tin chồng cố tình cắt dây, nên muốn không ai còn được qua cầu."]},{"t":"Núi khóc đêm","n":"Ông thợ săn Kình","d":"Gió rít qua vách đá như tiếng khóc than của ngàn oan hồn. Ai nghe lâu sẽ ngồi khóc mãi không dứt, rồi bỏ ăn mà chết.","s":["Ông Kình dẫn thầy tới vách Đá Thủng. Hàng trăm lỗ đục trên đá, thổi gió vào thành tiếng khóc, cạnh đó là mũi giáo gỉ.","Phải bịt từng lỗ đá bằng sáp ong trộn tro hương. Âm binh rách rưới bò ra từ khe đá, tay cầm giáo gãy.","Hồn đội trưởng lính thú họ Trịnh hiện ra. Ba trăm lính bị bỏ đói giữ đèo rồi chết rét, hắn đục đá để núi khóc thay họ."]},{"t":"Hang ổ Đầu Hổ","n":"Lý trưởng bản Cao","d":"Tiếng khóc trên núi vừa dứt, một băng giặc ma kéo về cướp phá các bản. Chúng cướp gạo, muối và cả hồn trẻ nhỏ.","s":["Lý trưởng đưa thầy một mũi tên khắc hình đầu hổ, nhặt được sau trận cướp. Dấu vết dẫn lên hang Đá Đen trên đỉnh.","Phải lẻn vào hang giải thoát hồn ba đứa trẻ bị nhốt trong chum sành. Toán sơn tặc ma vác đao xông ra chặn lối.","Sơn Tặc Đầu Hổ hiện ra, xưa bị quan quân phục kích chết oan. Hắn nói có tiếng gọi dưới lòng đất hứa trả hắn thân xác."],"b":"Sơn Tặc Đầu Hổ","bs":"geroh"},{"t":"Tiếng mõ trên vách","n":"Sư bà Diệu Hạnh","d":"Ngôi chùa treo trên vách Đá Treo bỏ hoang đã lâu, vậy mà mỗi canh ba vẫn vang tiếng mõ. Người dưới chân núi mất ngủ, gà không gáy.","s":["Sư bà kể mùa tuyết năm ấy sư thầy xuống núi xin gạo, để chú tiểu ở lại. Trong chùa thầy thấy bát cơm khô và chiếc mõ mòn vẹt.","Phải mang gạo và áo ấm lên chùa làm lễ cúng. Ma đói gầy trơ xương bám vách đá giành lấy bát cơm.","Hồn chú tiểu Tâm hiện ra, vẫn gõ mõ chờ thầy. Âm khí dưới núi khuấy lên đã biến nỗi chờ đợi của chú thành oán hận."]},{"t":"Mỏ chu sa sập","n":"Chị Nụ bán than","d":"Mỏ chu sa trong lòng núi sập từ mấy chục năm trước. Nay nước suối chảy ra đỏ quạch, ai uống cũng nôn ra máu.","s":["Chị Nụ dẫn thầy tới cửa mỏ. Trong khe đá còn treo chiếc đèn dầu của thợ mỏ, bấc vẫn cháy dù chẳng ai châm.","Phải đào thông lối hầm để nước độc thoát ra. Xác sống thợ mỏ người phủ bụi đỏ lừ lừ tiến tới, tay vung cuốc.","Hồn cai mỏ Thạch hiện ra. Hắn khóa cửa hầm khi mỏ sập để giữ chu sa cho chủ, nay bị chính thợ mỏ ma vây khốn."]},{"t":"Mưa máu đầu non","n":"Thầy lang Chẩn","d":"Trời đổ mưa đỏ, cây cỏ héo rũ, dân trong núi đổ bệnh. Mưa đặc tanh mùi máu, rơi xuống đâu đá nứt ra tới đó.","s":["Thầy lang Chẩn cho thầy xem nước mưa lắng trong bát, đáy có cặn chu sa lẫn máu. Mây đỏ cuộn ra từ đỉnh Hỏa Sơn.","Phải leo lên đỉnh đập vỡ bảy chum máu đặt quanh tế đàn. Quỷ sai mặt đỏ múa xích sắt lao ra canh giữ.","Hồn đồ đệ của một đạo sĩ hiện ra, hắn lấy máu thợ mỏ làm mưa nuôi lò đan. Sư phụ hắn vẫn đang luyện đan trong núi."]},{"t":"Lò đan bỏ hoang","n":"Cô Sương hái thuốc","d":"Khói tím bốc lên từ một hang đá sau đỉnh Hỏa Sơn. Người lạc vào đó trở ra tóc bạc trắng, quên cả tên mình.","s":["Cô Sương nhặt được một viên đan đỏ ối lăn ra từ hang. Viên đan ấm như tim người, ngửi thấy mùi chu sa và tóc cháy.","Phải dập tắt lò luyện đan bằng nước suối Thiêng gánh từ chân núi. Ma trơi tím bay ra từ miệng lò cản đường.","Hồn những người bị lấy tuổi thọ để luyện đan hiện ra, chỉ về hầm sâu nhất. Kẻ ăn đan vẫn còn đó, thân xác cứng như gỗ."]},{"t":"Đạo sĩ ăn đan","n":"Ông trưởng bản Pá","d":"Cả bản Pá già đi trong một đêm, trẻ con cũng lụ khụ chống gậy. Dưới hầm sâu nhất của núi có tiếng nhảy cộc cộc.","s":["Ông trưởng bản đưa thầy cuốn sổ đan phương tìm trong lò. Trang cuối viết: đủ chín trăm hồn sẽ bất tử, được Vương ban thưởng.","Phải phá trận đồ chín ngọn đèn đang hút tuổi thọ dân bản. Cương thi đồ đệ nhảy bổ ra, móng tay đen dài.","Đạo Sĩ Huyết Đan hiện ra, thân cứng như cương thi vì ăn quá nhiều đan. Hắn cười, nói Oán Linh Vương sẽ mở cửa cho kẻ bất tử."],"b":"Đạo Sĩ Huyết Đan","bs":"cuong_thi"},{"t":"Bia mộ mọc thêm","n":"Ông thủ từ Khải","d":"Rời núi, thầy quay lại rìa Nghĩa Địa Cổ. Mỗi sáng lại có thêm một tấm bia mới, khắc tên người trong xóm còn đang sống.","s":["Ông Khải chỉ những tấm bia còn ướt vụn đá. Ai bị khắc tên đều đổ bệnh, và vết đục trên bia đều nghiêng về bên trái.","Phải đập vỡ tấm bia khắc tên cháu ông Khải trước khi gà gáy. Oan hồn không bia không mộ bò lên vây quanh.","Hồn ông thợ khắc bia thuận tay trái hiện ra. Ông chết nghèo, không ai khắc bia cho, nên khắc tên người sống cho đỡ tủi."]},{"t":"Kẻ đào mộ thuê","n":"Chị Thắm bán hương","d":"Mộ cổ ở rìa nghĩa địa bị đào trộm liên tiếp. Bọn đào mộ đều chết giữa đường về, tay vẫn nắm chặt đồ tùy táng.","s":["Chị Thắm thấy một gã đào mộ còn sống chạy qua. Thầy đuổi theo, gã khai cả bọn được thuê đào tìm một chiếc gương đồng.","Phải trả đồ tùy táng về đúng từng ngôi mộ trong đêm. Xác sống chủ mộ lổm ngổm bò ra đòi lại của.","Kẻ thuê đào mộ lộ mặt: một bóng đen không mặt, nói chủ nhân hắn cần chiếc gương ở miếu cổ. Hắn tan thành khói khi bị đánh bại."]},{"t":"Gương soi hồn phách","n":"Cụ đồ Liêm","d":"Chiếc gương đồng trong miếu cổ giữa nghĩa địa hút hồn kẻ nào soi vào nó. Người bị hút chỉ còn cái xác ngồi cười.","s":["Cụ đồ Liêm đọc dòng chữ mờ sau gương: soi để nhớ người đã khuất. Gương vốn để thân nhân nhìn lại người thân lần cuối.","Phải phủ khăn tang lên gương và dán bùa giữ hồn. Oan hồn mắc kẹt trong gương tràn ra, mặt méo mó như trong nước.","Hồn bà cung nữ giữ gương hiện ra. Bà bị kẻ đào mộ xúc phạm, oán khí từ Quỷ Môn thổi vào biến gương thành bẫy hồn."]},{"t":"Đò đêm sông Lấp","n":"Ông lái đò Chín","d":"Con đò cũ trên sông Lấp cạnh nghĩa địa đêm nào cũng chở khách. Sáng ra người làng thấy dép ai để thẳng hàng trên bến.","s":["Ông Chín kể làng ven sông sắp đến kỳ tế Hà Bá. Thầy tìm thấy trong khoang đò một chiếc vòng bạc khắc tên Lụa.","Phải chặn con đò ma giữa dòng, cứu mấy người làng bị dụ lên. Thủy quỷ tay sai bám mạn đò kéo xuống nước.","Hồn người lái đò đầu tiên hiện ra, bị bắt chở hồn cho Hà Bá. Ông cầu thầy cứu cô Lụa, người sắp bị đem đi tế."]},{"t":"Hà bá đòi người","n":"Bà Hai mẹ cô Lụa","d":"Thủy quỷ dưới vực sâu đòi mỗi năm một mạng người làm vật tế. Năm nay làng chọn cô Lụa, con gái bà Hai bán bánh đúc.","s":["Bà Hai kể từ ngày nghĩa địa tràn nước, cứ rằm tháng bảy là có người chết đuối. Thầy thấy vực Đen sủi bọt mùi bùn tanh.","Phải cắt dây trói cứu cô Lụa khỏi bè tre đang trôi ra vực. Thủy quỷ tóc dài trồi lên quanh bè, kéo bè chìm xuống.","Hà Bá Oán Linh hiện ra từ đáy vực, xưa là quan coi đê bị dân dìm chết vì vỡ đê. Hắn đòi mạng thay cho cả làng đã chết đuối."],"b":"Hà Bá Oán Linh","bs":"thuy_quy"},{"t":"Quan tài tự đi","n":"Anh phu khiêng Tạo","d":"Một cỗ quan tài sơn son đêm đêm tự trượt trên đường làng ra nghĩa địa. Nó dừng trước nhà ai thì nhà ấy có tang.","s":["Anh Tạo nhận ra cỗ quan tài anh từng khiêng cho nhà họ Đỗ. Đáy quan tài trống trơn, chỉ có một bát cơm cúng úp ngược.","Phải theo quan tài tới ngôi mộ trống và làm lễ chôn lại. Toán quỷ sai khiêng kiệu mặt trắng vây kín ngã ba.","Hồn cụ Đỗ hiện ra. Con cháu tranh đất, chưa chôn cụ đã bán mộ phần, cụ đi tìm chỗ nằm và kéo người khác đi cùng."]},{"t":"Bát hương nguội","n":"Chị Hiền con dâu","d":"Một dãy mộ họ Tạ ở rìa nghĩa địa bị bỏ hoang từ khi con cháu dời đi xa. Đêm đến cả dãy mộ rên rỉ, cỏ mọc ngược.","s":["Chị Hiền là con dâu duy nhất còn về thắp hương. Thầy thấy bát hương họ Tạ lạnh tanh, cắm đầy chân hương gãy đôi.","Phải dọn cỏ, thắp lại hương cho mười hai ngôi mộ trước nửa đêm. Ma trơi lạnh lẽo kéo đến dập tắt từng nén hương.","Hồn cụ tổ họ Tạ hiện ra, giận con cháu bỏ quên. Thấy chị Hiền vẫn nhớ, cụ dịu đi, nhưng oán khí đã lan khắp dòng họ."]},{"t":"Ngã ba âm dương","n":"Cụ bà gánh hàng xén","d":"Cuối nghĩa địa có ngã ba, một lối về làng, một lối tới phế tích thành cổ. Người đi đêm cứ bị dắt về phía phế tích.","s":["Cụ bà chỉ cột mốc đá ở ngã ba, có người lén xoay mũi chỉ đường. Dưới cột có dấu móng sắt nặng trịch.","Phải xoay cột mốc về đúng hướng và chôn bùa trấn yểm dưới chân. Âm binh trinh sát giáp gỉ lao ra ngăn cản.","Hồn viên lính đưa tin hiện ra, bị Oán Linh Vương sai đi dụ người sống về thành. Hắn kể cửa âm phủ đang hé mở từng đêm."]},{"t":"Cổng thành sụp","n":"Ông lão gác cổng","d":"Thầy đặt chân tới Phế Tích Quỷ Môn. Cổng thành sụp một nửa, ai bước qua đều nghe tiếng hỏi mật khẩu rồi ngã quỵ.","s":["Ông lão gác cổng sống trong túp lều bên hào thành. Ông nhớ mật khẩu ngày xưa là tên cây lúa, nhưng đã quên mất nửa sau.","Phải tìm tấm thẻ bài lính gác chôn dưới chân cổng để biết mật khẩu. Oan hồn lính gác cầm giáo lao ra từ hốc tường.","Hồn lính gác trẻ tuổi hiện ra, chết khi mở cổng cho dân chạy nạn. Hắn bị phạt canh cổng mãi mãi, nay oán ngược cả người sống."]},{"t":"Quỷ tướng trấn môn","n":"Ông lão gác cổng","d":"Qua được cổng ngoài, thầy gặp con đường lát đá dẫn vào nội thành. Giữa đường có một bóng tướng khổng lồ đứng chắn.","s":["Ông lão kể ngày thành mất, tướng trấn môn thề giữ cổng tới hơi thở cuối. Thầy thấy tấm khiên đồng cắm giữa đường lát đá.","Phải đốt sáu đuốc hồn ở sáu góc đường để soi rõ quỷ tướng. Quỷ sai đầu trâu mặt ngựa lao ra dập đuốc.","Quỷ Tướng Trấn Môn lộ diện. Hắn vẫn giữ lời thề, nhưng nay giữ cửa cho Oán Linh Vương, kẻ đã phản bội cả thành."],"b":"Quỷ Tướng Trấn Môn","bs":"vo_tuong"},{"t":"Thành cổ không người","n":"Cô Ngân đi lạc","d":"Một tòa thành đổ nát hiện ra trong đêm, đèn đuốc sáng trưng mà không bóng người. Chợ đêm bày bánh trái, ai ăn vào sẽ ở lại.","s":["Cô Ngân đã ăn một chiếc bánh và đang mờ dần. Thầy thấy mọi chiếc đèn đều treo nghiêng, bánh trái làm bằng đất sét.","Phải tìm chiếc trống chợ và đánh ba hồi để phá ảo cảnh. Đám ma chợ đêm mặt không mũi miệng lao tới níu áo.","Hồn quan coi chợ hiện ra, vẫn diễn lại phiên chợ cuối trước ngày thành mất. Hắn muốn người sống ở lại cho chợ khỏi vắng."]},{"t":"Giếng cạn trong thành","n":"Bà cụ nhặt xương","d":"Giữa nội thành có cái giếng cạn, đêm đêm vọng lên tiếng hát ru. Ai cúi nhìn sẽ thấy mặt mình dưới đáy, mỉm cười gọi lên.","s":["Bà cụ nhặt xương kể khi thành bị vây, đàn bà con trẻ trốn xuống giếng. Thầy tìm thấy trên miệng giếng một chiếc trâm bạc.","Phải thả dây xuống đưa hài cốt lên và rải gạo muối. Oan hồn đáy giếng bám dây trèo lên, tay lạnh như nước đá.","Hồn người mẹ trẻ hiện ra, ôm đứa con không đầu. Nắp giếng do chính lệnh vua đóng lại, kẻ ấy nay là Oán Linh Vương."]},{"t":"Thư khố cháy dở","n":"Thầy đồ Uyên","d":"Thư khố của thành cổ đêm nào cũng bốc cháy, sáng ra vẫn nguyên. Tro sách bay khắp phế tích, rơi vào ai người ấy mất trí nhớ.","s":["Thầy đồ Uyên nhặt được một trang sử chưa cháy: vua thành này mở Quỷ Môn để gọi quân chết trận dậy giữ thành.","Phải cứu bộ sử thành cổ ra khỏi biển lửa ma. Ma trơi đỏ hình con chữ xoắn quanh kệ sách, đốt cháy áo thầy.","Hồn quan chép sử hiện ra, bị thiêu sống vì ghi lại tội vua. Ông trao cho thầy tên thật của Oán Linh Vương rồi tan đi."]},{"t":"Trống trận nửa đêm","n":"Anh Đinh đi rừng","d":"Từ tháp trống phía bắc thành cứ nửa đêm lại vang trống trận. Mỗi hồi trống, đất phế tích nứt thêm một đường.","s":["Anh Đinh đếm được mỗi đêm trống đánh đủ bốn mươi chín tiếng. Thầy thấy mặt trống bọc bằng da người, khắc bùa gọi binh.","Phải trèo lên tháp chọc thủng mặt trống. Âm binh rách giáp bò lên từ khe đất nứt, giáo mác tua tủa.","Hồn lính đánh trống hiện ra, bị trói vào tháp đến chết. Hắn cảnh báo đoàn âm binh đã tỉnh, sắp diễu qua phế tích."]},{"t":"Quân âm binh","n":"Ông lão gác cổng","d":"Đoàn âm binh giáp sắt diễu qua phế tích, mặt đất rung chuyển. Chúng tiến về phía các làng ngoài thành.","s":["Ông lão nhận ra cờ của đội thân binh nhà vua. Thầy thấy chúng bước theo nhịp một chiếc chuông đồng treo trên kiệu dẫn đầu.","Phải chặn đầu đoàn quân ở cầu đá và đập vỡ chuông đồng. Hàng hàng âm binh giáp sắt dàn trận xông lên.","Thống Lĩnh Giáp Đen hiện ra, chủ tướng của đội thân binh. Hắn chết vì lệnh vua bắt tử thủ, nay vẫn không dám trái lệnh."],"b":"Thống Lĩnh Giáp Đen","bs":"giap_sat"},{"t":"Lầu canh hướng bắc","n":"Cậu bé chăn dê Tũn","d":"Trên lầu canh hướng bắc có ánh đèn và bóng người đứng gác. Đêm đêm có mũi tên bắn xuống bất cứ ai đến gần.","s":["Cậu Tũn nhặt được một mũi tên quấn mảnh thư cũ: xin thay gác, con tôi sắp đầy tháng. Thư chưa bao giờ được gửi đi.","Phải trèo lên lầu canh dưới làn tên ma. Oan hồn lính canh từ các lỗ châu mai xông ra cản bước.","Hồn người lính gác hiện ra, vẫn chờ người tới thay gác. Thầy trao lá thư, hắn hỏi con mình nay đã lớn chưa rồi tan đi."]},{"t":"Kho lương mục","n":"Bà Tám nấu cháo","d":"Kho lương của thành cổ đầy những bao thóc mục. Ai đi ngang đều đói cồn cào, ăn bao nhiêu cũng không no.","s":["Bà Tám kể thành bị vây chín tháng, vua giữ lương cho quân, để dân chết đói. Thầy thấy trên thóc mục có dấu răng người.","Phải nấu nồi cháo thí, mời hồn đói về ăn rồi siêu thoát. Ma đói giành giật xô ra, cắn xé lẫn nhau.","Hồn quan coi kho hiện ra, chết đói giữa kho lương vì không dám mở. Hắn khóc xin tha tội, oán khí nhạt dần theo khói cháo."]},{"t":"Mộ tập thể ngoài thành","n":"Ông Khải thủ từ","d":"Ông Khải tìm đến báo tin: bãi đất phía nam Nghĩa Địa Cổ đang lún xuống. Đó là mộ chung của dân thành cổ ngày thất thủ.","s":["Ông Khải mang theo sổ đinh làng cũ, ghi tên dân thành cổ. Thầy thấy đất lún thành hình phễu, xoáy về hướng Quỷ Môn.","Phải đọc tên từng người trong sổ để giữ hồn họ lại. Oan hồn bị hút về Quỷ Môn kéo thành dòng, vồ lấy thầy.","Hồn bà trưởng xóm hiện ra, dẫn đầu dòng hồn bị hút đi. Gọi đúng tên, bà tỉnh lại và hứa giữ dân mình không về với Vương."]},{"t":"Ngai vàng oán khí","n":"Thầy đồ Uyên","d":"Chiếc ngai đá giữa phế tích tỏa oán khí đen kịt, cây cỏ quanh đó chết sạch. Dưới ngai là bậc thang dẫn xuống cửa âm phủ.","s":["Thầy đồ Uyên dịch dòng chữ trên lưng ngai: ai ngồi đây sẽ làm vua cả hai cõi. Ngai lạnh buốt, rỉ ra thứ nước đen.","Phải tháo chín viên ngọc mắt rồng đang hút oán khí vào ngai. Quỷ sai cầm cờ lệnh vua từ bóng tối xông ra.","Hồn viên thái giám hầu ngai hiện ra, trung thành với vua tới chết. Hắn báo hoàng hậu đang chờ thầy trong cung sau."]},{"t":"Hoàng hậu áo trắng","n":"Cô cung nữ Lan","d":"Cung sau phế tích phủ một lớp sương trắng, trong sương có tiếng khóc của đàn bà. Ai vào sương đều quên đường ra.","s":["Hồn cô cung nữ Lan kể hoàng hậu từng can vua đừng mở Quỷ Môn, bị giam chết trong cung. Thầy thấy chiếc lược ngà gãy đôi.","Phải thắp đèn hồn soi đường xuyên qua lớp sương. Oán linh áo trắng không mặt bay ra từng đàn vây lấy thầy.","Bạch Y Hoàng Hậu hiện ra, oán chồng nhưng vẫn giữ cửa cho chồng. Đánh bại bà, bà chỉ đường xuống Quỷ Môn rồi khóc mà tan."],"b":"Bạch Y Hoàng Hậu","bs":"ao_trang"},{"t":"Cầu Nại Hà gãy","n":"Bà lão bán nước chè","d":"Cây cầu đá dẫn tới Quỷ Môn đã gãy làm đôi. Dưới cầu là dòng nước đen trôi đầy hồn người, cả hồn dân các vùng thầy từng qua.","s":["Bà lão bán chè đứng ở đầu cầu, mời thầy uống bát chè quên. Thầy từ chối, nhặt được một hòn đá cầu có khắc ấn của thành.","Phải ghép lại cầu bằng đá khắc ấn nhặt dọc bờ sông. Đám quỷ sai dưới dòng nước đen trồi lên kéo thầy xuống.","Hồn người giữ cầu hiện ra, bị Oán Linh Vương đập gãy cầu để không ai qua lại được. Ông nhường đường cho thầy đi tiếp."]},{"t":"Đèn lồng dẫn hồn","n":"Ông lão làm đèn","d":"Hàng nghìn hồn lạc từ khắp sáu vùng trôi về bờ sông, không biết đường về. Âm khí từ Quỷ Môn đang hút họ vào.","s":["Ông lão làm đèn đã dán sẵn ba trăm chiếc đèn giấy cho người chết. Thầy thấy trong dòng hồn có cả người quen từ làng Hương Khói.","Phải thả đèn xuống sông dẫn hồn lạc về hướng ngược Quỷ Môn. Ma trơi đen lao xuống dập tắt từng chiếc đèn.","Hồn người làm đèn đầu tiên của thành hiện ra, bị Vương bắt đốt đèn gọi hồn. Ông quay đèn lại, dẫn hồn đi thay cho thầy."]},{"t":"Đêm trước cửa quỷ","n":"Ông lão gác cổng","d":"Đêm cuối trước Quỷ Môn, thầy cùng các linh hồn đồng hành dựng trại bên tường thành. Gió mang tiếng gọi tên thầy.","s":["Ông lão gác cổng mang tới bát cơm nắm cuối cùng của mình. Thầy thấy bóng mình trên tường thành không chịu theo mình nữa.","Phải giữ đống lửa trại cháy tới sáng để bảo vệ các linh hồn đồng hành. Oan hồn và quỷ sai ùa tới từ mọi phía.","Bóng của Oán Linh Vương bước ra từ cái bóng của thầy. Hắn dụ thầy bỏ cuộc, hứa trả lại cha mẹ thầy từ cõi âm."]},{"t":"Quỷ Môn Quan","n":"Ông lão gác cổng","d":"Cánh cửa âm phủ đã mở toang. Oán Linh Vương đứng chắn, chờ trận cuối. Sau lưng hắn, âm khí cuồn cuộn tràn ra khắp sáu vùng.","s":["Ông lão gác cổng đưa thầy chiếc then cài cổng thành ngày xưa. Ông nói chỉ có then này mới khóa được Quỷ Môn.","Phải xuyên qua hàng hàng quân âm phủ tới trước cửa. Oan hồn, quỷ sai, xác sống từ khắp các vùng ùa ra lần cuối.","Oán Linh Vương hiện thân, xưa là vua thành cổ mở cửa âm phủ để giữ ngai. Gọi tên thật của hắn, đánh bại hắn và đóng cửa lại."],"b":"Oán Linh Vương","bs":"vuong"}];
const NAN=NQ.map(q=>[q.t,q.d]);
const BOSSES={};NQ.forEach((q,i)=>{if(q.b)BOSSES[i]=[q.b,q.bs];});
/* chia đoạn dài thành các trang hộp thoại theo câu */
function pages(t,max=150){const ss=t.match(/[^.!?…]+[.!?…]+["”]?\s*|[^.!?…]+$/g)||[t];const out=[];let cur='';for(const x of ss){if(cur&&(cur+x).length>max){out.push(cur.trim());cur='';}cur+=x;}if(cur.trim())out.push(cur.trim());return out;}
/* save trước v4.7 dùng thang 24 nạn: đổi tiến độ sang thang 99 */
function migrateNan(){if(G.nv===99)return;const k=Math.min(72,G.nan*3+G.qs),nk=Math.min(296,Math.round(k*NAN.length/24));G.nan=G.nan>=24?NAN.length:Math.floor(nk/3);G.qs=G.nan>=NAN.length?0:nk%3;G.nv=99;G.qt=null;G.npcOld=null;}
function placeMarker(){placeMarker0();if(G.qt){G.qt.hx=G.qt.x;G.qt.hy=G.qt.y;npcKind(G.qt);}}
function placeMarker0(){if(G.nan>=NAN.length){G.qt=null;return;}
  if(G.nan===NAN.length-1&&G.qs===2){G.qt={x:WD.goal.x,y:WD.goal.y+2};return;}
  /* chặng thứ k nằm ở phần k/72 của hành trình; tìm ô đi tới được gần đó, sát đường cái, không trùng điểm đến */
  const k=G.nan*3+G.qs,L=WD.path.length,ti=WD.path[clamp(Math.round((k+.6)/(NAN.length*3)*(L-1)),0,L-1)],tx=ti%MW,ty=(ti-tx)/MW;
  const dist=new Int16Array(MW*MH).fill(-1),Q=[PL.y*MW+PL.x];dist[Q[0]]=0;
  for(let h=0;h<Q.length;h++){const i=Q[h],x=i%MW,y=(i-x)/MW;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,j=ny*MW+nx;if(nx<0||ny<0||nx>=MW||ny>=MH||dist[j]>=0||blocked(nx,ny))continue;dist[j]=dist[i]+1;Q.push(j);}}
  const nearRoad=(x,y)=>{for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const X=x+dx,Y=y+dy;if(X>=0&&Y>=0&&X<MW&&Y<MH&&WD.road[Y*MW+X])return true;}return false;};
  for(const r of[3,6,10,16]){const cand=[];for(let y=Math.max(1,ty-r);y<=Math.min(MH-2,ty+r);y++)for(let x=Math.max(1,tx-r);x<=Math.min(MW-2,tx+r);x++){const d=dist[y*MW+x];if(d<6||poiAt(x,y)||!nearRoad(x,y)||WD.pois.some(p=>Math.abs(p.x-x)+Math.abs(p.y-y)<3))continue;cand.push({x,y});}
    if(cand.length){G.qt=cand[Math.floor(R()*cand.length)];return;}}
  G.qt={x:tx,y:ty};}

const BG={};
function bgFor(k){if(BG[k])return BG[k];const W=240,H=160;const cvs=document.createElement('canvas');cvs.width=W;cvs.height=H;const x=cvs.getContext('2d');
  const band=(y0,y1,c0,c1)=>{for(let y=y0;y<y1;y++){x.fillStyle=((y-y0)/(y1-y0))<.5?c0:c1;x.fillRect(0,y,W,1);}
    const mid=Math.floor((y0+y1)/2);for(let xx=0;xx<W;xx+=2){x.fillStyle=c1;x.fillRect(xx+(mid%2),mid-1,1,1);x.fillStyle=c0;x.fillRect(xx+1-(mid%2),mid,1,1);}};
  const blob=(cx,cy,rx,ry,col)=>{x.fillStyle=col;for(let yy=-ry;yy<=ry;yy++){const w=Math.round(rx*Math.sqrt(1-(yy*yy)/(ry*ry)));x.fillRect(Math.round(cx-w),Math.round(cy+yy),w*2,1);}};
  const P={forest:['#8fd0f0','#c8ecf5','#1d563e','#2c7650','#6cae46','#b8b860','#549a3c'],grave:['#3a2a5a','#a85a6a','#2a2a3a','#3a3a4c','#5a6650','#7a7a60','#46503e'],ruins:['#5a1420','#c84a3a','#2a1a24','#3e2a34','#5b4a4a','#7a6058','#3f3038'],boss:['#140818','#4a1430','#1a0e24','#2a1838','#3a2a3a','#5a3a50','#22142a'],meadow:['#8fd0f0','#c8ecf5','#2e6b2e','#4c9a3a','#86c858','#d8d070','#62a848'],swamp:['#5a6a6a','#9ab0a8','#2a3a34','#3a4a40','#55704a','#6a8a5a','#3f6466'],mount:['#5a4a70','#b09ac0','#4a3e50','#6a5a60','#a08e68','#b8a67e','#887656']}[k];
  band(0,26,P[0],P[1]);x.fillStyle=P[1];x.fillRect(0,26,W,30);
  if(k==='grave'||k==='boss'||k==='ruins'){blob(138,14,8,8,k==='boss'?'#e04040':'#f0e8c8');}
  if(k==='mount'){for(let i=0;i<6;i++){x.fillStyle=i%2?'#7a6888':'#8a78a0';const bx=i*44-10;x.beginPath();x.moveTo(bx,56);x.lineTo(bx+26,14+(i%3)*6);x.lineTo(bx+52,56);x.fill();}}
  for(let i=0;i<14;i++)blob(i*19+((i%2)*6),40+(i%3)*3,14,16,P[2]);
  for(let i=0;i<12;i++)blob(i*22+10,50+(i%2)*2,12,8,P[3]);
  x.fillStyle=P[4];x.fillRect(0,56,W,104);
  for(let i=0;i<40;i++){const a=hash(i,3,k.length)*W,b=60+hash(i,5,k.length)*44;blob(a,b,6+hash(i,7)*10,2+hash(i,9)*2,i%3?P[5]:P[6]);}

function rv(n){return Math.max(1,Math.round(n*(.5+R())));}
function evOut(o){const L=[],d=diep();

  if(o.hp){const v=Math.ceil(d.mhp*o.hp*(.5+R()));d.hp=Math.max(1,d.hp-v);L.push('Minh Dạ -'+v+' HP');}
  if(o.heal){const f=o.heal*(.5+R());healAll(f);sfx('heal');L.push('cả đội hồi '+Math.round(f*100)+'% HP');}
  if(o.mp){for(const u of G.party)u.mp=u.mmp;L.push('cả đội đầy linh lực');}
  if(R()<(o.luck??.2)){const k=ri(0,4);
    if(k===0){G.charms++;L.push('may mắn: +1 bùa');}else if(k===1){G.pill.hp++;L.push('may mắn: +1 Hồi Hồn Đan');}else if(k===2){G.pill.mp=(G.pill.mp||0)+1;L.push('may mắn: +1 Tụ Linh Đan');}

  if(R()<(o.risk??.08)){const k=ri(0,2);
    if(k===0){const v=Math.ceil(d.mhp*(.05+R()*.1));d.hp=Math.max(1,d.hp-v);L.push('xui: âm khí nhập, Minh Dạ -'+v+' HP');}
    else if(k===1){const v=Math.min(G.silver,ri(2,6));if(v){G.silver-=v;L.push('xui: rơi mất '+v+' bạc');}}
    else{for(const u of G.party)u.mp=Math.max(0,u.mp-Math.ceil(u.mmp*.3));L.push('xui: hao 30% linh lực');}}

const CAM={x:0,y:0};
function walkTo(sx,sy){{const Z=mapZoom();sx*=Z;sy*=Z;}const tx=Math.floor((sx+CAM.x)/TS),ty=Math.floor((sy+CAM.y)/TS);
  if(tx<0||ty<0||tx>=MW||ty>=MH)return;if(tx===PL.x&&ty===PL.y){mapInput('a');return;}
  PL.npcGoal=null;if(G.qt){const p=npcPx(G.qt),wx=sx+CAM.x,wy=sy+CAM.y;if((tx===G.qt.x&&ty===G.qt.y)||(wx>=p.x-1&&wx<p.x+17&&wy>=p.y-14&&wy<p.y+16))return walkToNpc();}{const wx=sx+CAM.x,wy=sy+CAM.y;for(const v of vilNear()){if(!seen[v.y*MW+v.x])continue;const p=npcPx(v);if((tx===v.x&&ty===v.y)||(wx>=p.x-1&&wx<p.x+17&&wy>=p.y-14&&wy<p.y+16))return walkToNpc(false,v);}const b=bldTap(tx,ty);if(b)return walkToB(b);}
  if(blocked(tx,ty)||!seen[ty*MW+tx]){sfx('no');PL.mark={x:tx,y:ty,t:500,bad:true};return;}
  const st=PL.y*MW+PL.x,goal=ty*MW+tx;
  /* v6.6.1: rào bao làng nên lối vào có thể nằm trong vùng chưa khám phá; tìm đường qua ô đã thấy trước, không được thì cho đi qua cả ô chưa thấy */
  const bfs=un=>{const prev=new Int32Array(MW*MH).fill(-1),Q=[st];prev[st]=st;
    for(let h=0;h<Q.length&&prev[goal]<0;h++){const i=Q[h],x=i%MW,y=(i-x)/MW;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,j=ny*MW+nx;if(nx<0||ny<0||nx>=MW||ny>=MH||prev[j]>=0||blocked(nx,ny)||(!un&&!seen[j]&&j!==goal)||(j!==goal&&poiIdx(j)))continue;prev[j]=i;Q.push(j);}}return prev;};
  let prev=bfs(false);if(prev[goal]<0)prev=bfs(true);
  if(prev[goal]<0){sfx('no');PL.mark={x:tx,y:ty,t:500,bad:true};return;}
  const path=[];for(let j=goal;j!==st;j=prev[j]){const i=prev[j],d=j-i;path.unshift(d===1?'right':d===-1?'left':d===MW?'down':'up');}
  PL.path=path;PL.mark={x:tx,y:ty,t:99999,bad:false};sfx('sel');}

/* ---------- quest NPCs walk about their spot ----------
   v4.3 (người chơi yêu cầu): người giao nhiệm vụ đứng cố định quanh chỗ ban đầu (nhà hx,hy), đi lại trong bán kính
   3 ô ngang, 2 ô dọc; đứng chờ khi thầy pháp tới gần. Hình luôn được vẽ kể cả khi ô còn sương mù, nên không còn
   cảnh tự dưng hiện ra. Người đã giao xong nhiệm vụ không biến mất mà ở lại đi dạo (tối đa 3 người, khuất xa mới bỏ). */
const NPCR={rx:3,ry:2,wait:4,stepMs:420};
const NM=new WeakMap();
function nst(q){let s=NM.get(q);if(!s){if(q.hx==null){q.hx=q.x;q.hy=q.y;}npcKind(q);s={fx:q.x,fy:q.y,t:1,cool:600+R()*1500,face:1};NM.set(q,s);}return s;}
function npcList(){return(G.npcOld||[]).concat(G.qt?[G.qt]:[],vilNear());}
function npcPx(q){const s=nst(q);const t=s.t>=1?1:s.t;return{x:lerp(s.fx,q.x,t)*TS,y:lerp(s.fy,q.y,t)*TS};}
function npcRow(q){const s=nst(q);return s.t<1?Math.max(q.y,s.fy):q.y;}
function npcOldAt(x,y){return(G.npcOld||[]).some(q=>q.x===x&&q.y===y);}
/* người qua đường đã xong việc không chắn lối: thầy pháp bước vào thì họ nhường, đổi chỗ cho nhau */
function npcSwap(x,y){for(const q of(G.npcOld||[]).concat(vilNear()))if(q.x===x&&q.y===y){const s=nst(q);s.fx=q.x;s.fy=q.y;s.t=0;s.cool=2500;q.x=PL.x;q.y=PL.y;}}
function npcNear(x,y){return npcList().some(q=>Math.abs(q.x-x)+Math.abs(q.y-y)===0);}
function npcFree(q,x,y){if(x<1||y<1||x>=MW-1||y>=MH-1||blocked(x,y)||poiAt(x,y))return false;if(q.vil&&townAt(x,y)!==q.ti)return false;if(Math.abs(x-q.hx)>NPCR.rx||Math.abs(y-q.hy)>NPCR.ry)return false;
  if(x===PL.x&&y===PL.y)return false;if(PL.moving&&x===PL.fx&&y===PL.fy)return false;if(npcList().some(o=>o!==q&&o.x===x&&o.y===y))return false;
  if(G.lg&&G.lg.some(g=>g.dead<0&&g.x===x&&g.y===y))return false;return true;}
function npcTick(dt){if(!G)return;
  if(G.npcOld)G.npcOld=G.npcOld.filter(q=>Math.abs(q.x-PL.x)<=24||Math.abs(q.x*TS+8-PL.px)<W);
  for(const q of npcList()){const s=nst(q);
    if(s.t<1){s.t=Math.min(1,s.t+dt/NPCR.stepMs);continue;}
    const d=Math.abs(q.x-PL.x)+Math.abs(q.y-PL.y);
    if(!q.vil&&d<=NPCR.wait){if(PL.x!==q.x)s.face=PL.x>q.x?1:-1;s.cool=Math.max(s.cool,700);continue;}
    if(busy||DLG||CH)continue;
    if((s.cool-=dt)>0)continue;s.cool=1300+R()*2200;
    const back=Math.abs(q.x-q.hx)+Math.abs(q.y-q.hy)>2&&R()<.5;
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]].sort(()=>R()-.5);
    if(back)dirs.sort((a,b)=>(Math.abs(q.x+a[0]-q.hx)+Math.abs(q.y+a[1]-q.hy))-(Math.abs(q.x+b[0]-q.hx)+Math.abs(q.y+b[1]-q.hy)));
    for(const[dx,dy]of dirs){const nx=q.x+dx,ny=q.y+dy;if(!npcFree(q,nx,ny))continue;s.fx=q.x;s.fy=q.y;s.t=0;if(dx)s.face=dx;q.x=nx;q.y=ny;break;}}
  /* đang bấm đi tới người giao việc mà người ấy vừa bước đi: tính lại đường */
  {const nq=PL.npcQ||G.qt;if(nq&&nq.dead>=0){PL.npcGoal=null;PL.npcQ=null;}else if(PL.npcGoal&&nq&&!PL.moving&&(PL.npcGoal.x!==nq.x||PL.npcGoal.y!==nq.y))walkToNpc(true,nq);}}

  if(s.face<0){c.save();c.translate(sx+17,0);c.scale(-1,1);c.drawImage(sp,0,sy-14+by,18,30);c.restore();}else c.drawImage(sp,sx-1,sy-14+by,18,30);

function walkToNpc(quiet,q){q=q||G.qt;if(!q)return;PL.npcGoal={x:q.x,y:q.y};PL.npcQ=q;
  const prev=new Int32Array(MW*MH).fill(-1),st=PL.y*MW+PL.x,goal=q.y*MW+q.x,Q=[st];prev[st]=st;
  for(let h=0;h<Q.length&&prev[goal]<0;h++){const i=Q[h],x=i%MW,y=(i-x)/MW;for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy,j=ny*MW+nx;if(nx<0||ny<0||nx>=MW||ny>=MH||prev[j]>=0||(j!==goal&&blocked(nx,ny)))continue;prev[j]=i;Q.push(j);}}

function loyOf(u){return!u||u.id==='diep'?100:u.loy==null?100:u.loy;}
function loyAdd(u,n){u.loy=clamp(loyOf(u)+n,0,100);if(u.loy>=100)u.loyT=null;}
function loyTick(){if(!G)return;const now=Date.now();for(const u of G.box||[]){if(!u||u.id==='diep')continue;const l=loyOf(u);if(l>=100){u.loyT=null;continue;}

function calc(a,d,mult=1,hitB=0,crB=0){const w=weapon(a),ab=a.b||{},db=d.b||{};
  if(isP(a)&&!isP(d)&&(G.sect==='daosi'&&(d.kind==='Cương Thi'||d.kind==='Xác Chết')||G.sect==='amduong'&&d.kind==='Thức Thần'))mult*=1.25;
  if(a.id==='lee'&&G.sect==='daosi'&&isP(a))mult*=1.2;
  hitB-=(SPECIES[d.id]&&SPECIES[d.id].ev||0)+(db.phase?45:0);
  let dmg=(a.atk+w.mt)*mult*(ab.weak?0.7:1)-d.def*(db.brk?0.6:1);
  if(isP(a)&&G.sect==='daosi')dmg*=1.1;if(isP(a)&&ab.might)dmg*=1.3;if(isP(d)&&G.sect==='tusi')dmg*=.85;if(isP(d)&&B&&B.sum&&B.sum.k==='shiki'&&d===B.ally)dmg*=.8;if(isP(d)&&G.party.slice(0,3).some(u=>u.perk==='amida'&&u.hp>0))dmg*=.9;

function aiPick(u){const sk=skillsOf(u);const E=B.enemy;

  let best=-1,bv=0;sk.forEach((s,i)=>{if(s.k==='heal'||s.k==='guard'||s.k==='pguard'||s.k==='buff'||s.k==='pheal'||s.k==='revive'||s.k==='phase'||s.k==='decoy'||skNo(u,s)||(s.k==='sum'&&B.sum))return;const L=s.L&&LSK[s.L];if(L&&(s.k==='focus'&&u.b.foc||s.k==='conf'&&E.b.conf||s.k==='weak'&&E.b.weak))return;const v=L&&s.k!=='dmg'?(s.k==='focus'?1.3:s.k==='steal'?1.1:s.k==='conf'?1.5:s.k==='weak'?1.4:1+(s.x||1)*.4):(s.x||1)*(L&&L.hits||1)+(L&&L.inf&&!E.b[L.inf]?.3:0)+(s.k==='sum'?1.2:0)+(s.k==='rally'?.4*G.party.slice(0,3).filter(x=>x!==u&&x.hp>0).length:0)+(s.k==='stun'&&!E.b.stun?.6:0)+(s.k==='weak'&&!E.b.weak?.4:0)+(s.k==='brk'&&!E.b.brk?.4:0);if(v>bv){bv=v;best=i;}});
  if(best>=0&&R()<.7)return'sk:'+best;return'atk';}
async function startBattle(foes,o={}){

  for(const f of foes){f.b={};foeBoost(f);}for(const u of G.party)u.b={};
  B={pose:{e:null,a:null},foes,fi:0,enemy:foes[0],ally:lead(),o,bg:o.bg||((o.kind==='boss'||o.kind==='judge')?'boss':ZONES[zoneAt(PL.x)].bg),eo:{x:-90,y:0},ao:{x:90,y:0},eA:1,aA:1,eS:1,eF:0,aF:0,hp:{e:foes[0].hp,a:0},mi:0,sub:null,si:0,phase:'intro',msg:'',msgT:0,auto:!!G.auto,forced:false,shake:0,tal:null,pillar:0,ring:0,dark:0,lvl:null,expBar:null,flash:0,gain:[],loot:[],ast:null};

    else if(B.forced){B.msg='Chọn người ra trận thay '+B.ally.name;act=await menuChoice('sw');}

    else if(B.auto&&capOpen(B.enemy)&&!B.enemy.capSeen){/* v11.6.1: quái vào ngưỡng thu phục thì tạm tắt tự động trong trận này để chọn bằng tay (G.auto giữ nguyên cho trận sau) */B.enemy.capSeen=1;B.auto=false;B.msg='Tắt tự động: '+B.enemy.name+' đã yếu, có thể thu phục';B.msgT=1200;sfx('sel');await wait(500);const r=await capAsk(B.enemy);act=r||await menuChoice();}

function lScore(E,A,k){const s=LSK[k],ai=lAI(E),cf=aiCfg(E),hp=E.hp/E.mhp;
  if(s.enr&&!ai.enr)return 0;if(E.mp<s.c||(ai.cd[k]||0)>0)return 0;if(s.max&&(ai.use[k]||0)>=s.max)return 0;
  if(s.hp&&(hp<s.hp[0]||hp>s.hp[1]))return 0;

  if(s.k==='heal')w*=1+3*(1-hp);
  if(s.k==='guard'&&E.b.guard)return 0;
  if(s.k==='focus'&&ai.focus)return 0;
  if(s.k==='dmg'&&ai.focus)w*=1.6;
  if(s.k==='summon'){if(ai.w>=cf.maxW)return 0;w*=1-ai.w/cf.maxW;}
  if(s.inf&&s.skip&&A.b[s.inf]){if(s.k==='conf'||s.k==='weak')return 0;w*=.6;}
  if((s.k==='dmg'||s.k==='conf')&&A.hp/A.mhp<.3)w+=s.fin||0;
  /* v7.9 quái thông minh hơn: thấy đòn kết liễu thì dùng, né đánh vào thế thủ, ưu tiên hồi máu khi yếu */
  if(s.k==='dmg'&&calc(E,A,s.x*(ai.focus?1.2:1)).dmg*(s.hits||1)>=A.hp)w+=3;
  if(A.b.dfd||A.b.guard){if(s.k==='dmg')w*=.5;else if(s.k!=='heal')w*=1.6;}

/* ================= BẢN ONLINE (v1.0) =================

let onlUIq=0;

/* server riêng (build_online.py --server wss://...) thay cho kênh room của claude.ai; để trống thì dùng claude.ai */
const ONL_SERVER="wss://game.giangmaluc.workers.dev/ws";
/* bộ chuyển: WebSocket tới server riêng nhưng có cùng kiểu gọi như room của claude.ai (presence, onPeers, join...) */
function onlWsRoom(url,o={}){const rooms=new Map(),cls=[];let ws=null,you=null,conn=false,wait=1000,pingT=null,dead=false;
  let dev='';try{dev=localStorage.getItem('gms-dev')||'';if(!dev){dev='d'+Math.random().toString(36).slice(2,12)+Date.now().toString(36);localStorage.setItem('gms-dev',dev);}}catch(_){dev='d'+Math.random().toString(36).slice(2,12);}
  const tx=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
  const setConn=c=>{if(c===conn)return;conn=c;for(const f of cls)try{f(c);}catch(e){console.error(e);}};
  function mk(name){const R={name,others:new Map(),mine:{},ls:[],snap:Object.freeze([]),dirty:false,tm:null,ready:false,wq:[]};
    R.build=()=>{const a=[];if(you)a.push({peer:you,sameTab:true,isMe:true,kind:'viewer',guest:false,by:null,presence:R.mine,updatedAt:Date.now()});
      for(const[k,p]of R.others)a.push({peer:k,sameTab:false,isMe:false,kind:'viewer',guest:false,by:null,presence:p,updatedAt:Date.now()});R.snap=Object.freeze(a);
      for(const f of R.ls)try{f({peers:R.snap,joined:[],left:[],updated:[]});}catch(e){console.error(e);}};
    R.flush=()=>{R.tm=null;if(!R.dirty||!conn||!R.ready)return;R.dirty=false;tx({t:'p',r:name,p:R.mine});};
    R.api={name,presence(patch){for(const k in patch){if(patch[k]===null)delete R.mine[k];else R.mine[k]=patch[k];}R.mine={...R.mine};R.dirty=true;if(!R.tm)R.tm=setTimeout(R.flush,33);return Promise.resolve();},
      peers:()=>R.snap,onPeers(f){R.ls.push(f);setTimeout(()=>f({peers:R.snap,joined:R.snap,left:[],updated:[]}),0);return()=>{R.ls=R.ls.filter(x=>x!==f);};},
      connected:()=>conn,onConnection(f){cls.push(f);setTimeout(()=>f(conn),0);return()=>{};},emit:()=>Promise.resolve(),on:()=>()=>{},
      join:n=>join(n),raw:x=>tx(x),leave(){rooms.delete(name);tx({t:'leave',r:name});R.ls=[];return Promise.resolve();}};
    return R;}
  function join(n){if(rooms.has(n))return Promise.resolve(rooms.get(n).api);if(!conn)return Promise.reject({code:'upstream_error'});
    const R=mk(n);rooms.set(n,R);tx({t:'join',r:n});return new Promise((res,rej)=>{R.wq.push(res);setTimeout(()=>{if(!R.ready){rooms.delete(n);rej({code:'upstream_error'});}},8000);});}
  function connect(){try{ws=new WebSocket(url);}catch(e){setTimeout(connect,wait);return;}
    ws.onopen=()=>{wait=1000;tx({t:'hello',id:dev,v:1,tok:o.tok||undefined});clearInterval(pingT);pingT=setInterval(()=>tx({t:'ping'}),25000);};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(_){return;}
      if(m.t==='welcome'){you=m.you;for(const[n,R]of rooms){R.others.clear();R.ready=false;if(n)tx({t:'join',r:n});}setConn(true);return;}
      if(m.t==='auth'){if(o.onAuth)o.onAuth(m.u);return;}
      if(m.t==='err'&&(m.m==='auth'||m.m==='dup')){dead=true;if(o.onErr)o.onErr(m.m);return;}
      const R=rooms.get(typeof m.r==='string'?m.r:'');if(!R)return;
      if(m.t==='peers'){R.others.clear();for(const q of m.list||[])if(q.peer!==you)R.others.set(q.peer,Object.freeze(q.p||{}));R.ready=true;R.dirty=true;R.flush();R.build();const w=R.wq;R.wq=[];w.forEach(f=>f(R.api));}
      else if(m.t==='up'&&m.peer!==you){R.others.set(m.peer,Object.freeze(m.p||{}));R.build();}
      else if(m.t==='gone'){R.others.delete(m.peer);R.build();}};

function onlPeers(ch){
  for(const p of ch.peers){if(p.sameTab){ONL.me=p.peer;break;}}
  const live=new Set();
  for(const p of ch.peers){if(p.sameTab||p.kind!=='viewer')continue;const s=p.presence||{};live.add(p.peer);
    let r=ONL.peers.get(p.peer);const fresh=!r;

    r.nm=onlClean(s.nm).slice(0,18)||'Pháp Sư';r.hn=[...onlClean(s.hn)].slice(0,12).join('');r.bot=!!s.bot;r.lvp=s.lvp|0;r.guest=p.guest;r.tx=+s.x||0;r.ty=+s.y||0;r.f=s.f<0?-1:1;r.m=!!s.m;r.lv=s.lv|0;if(r.lvp&&G){const d=diep();r.lv=(d?d.lv:1)+r.lvp;}r.sc=String(s.sc||'');
    r.rp=s.rp|0||1000;r.w=s.w|0;r.l=s.l|0;r.on=s.sc&&s.sc!=='title';
    if(fresh||Math.abs(r.tx-r.x)>96||Math.abs(r.ty-r.y)>96){r.x=r.tx;r.y=r.ty;}
    const sy=s.say&&typeof s.say==='object'?s.say:null;

    if(sy&&typeof sy.i==='number'&&sy.i!==r.sayI){const t=onlClean(sy.t).slice(0,120);
      if(t&&(!fresh||Date.now()-(+sy.at||0)<15000)){r.sayT=t;r.sayAt=performance.now();onlAddChat(r.nm,t,false);}
      r.sayI=sy.i;}
