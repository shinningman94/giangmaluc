plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.vuaphapsu.game'
    compileSdk 34

    defaultConfig {
        applicationId 'vn.vuaphapsu.game'
        minSdk 21
        targetSdk 34
        versionCode 291
        versionName '16.50'
    }

    buildTypes {
        release {
            minifyEnabled true            // R8 rút gọn + làm rối mã Java trong APK
            shrinkResources true
            debuggable false              // bản phát hành không cho gỡ lỗi
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
